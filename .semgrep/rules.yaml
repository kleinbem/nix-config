rules:
  - id: no-options-in-hosts
    paths:
      include:
        - "/hosts/**/*.nix"
        - "/users/**/*.nix"
    languages:
      - generic
    patterns:
      - pattern-regex: '(?<![a-zA-Z0-9_.-])options\.[a-zA-Z0-9_.-]+\s*=|(?<![a-zA-Z0-9_.-])options\s*=\s*\{'
    message: "Conventions violation: Hosts and users must only set options, never declare them (declare in modules/ or presets instead)."
    severity: ERROR

  - id: no-local-file-urls-in-flake-lock
    paths:
      include:
        - "flake.lock"
    languages:
      - generic
    patterns:
      - pattern-regex: '"url"\s*:\s*"file://[^"]*"'
    message: "flake.lock pins local file:// inputs, causing non-reproducible evaluation."
    severity: ERROR
