version: '1.0'
description: Complete AI Knowledge Manifest for the kleinbem fleet. Auto-generated. Do not edit by hand.
invariants:
  switchboard_pattern: 'All system options live under `my.*` (schema in nix-config/modules/nixos/options.nix), Home-Manager
    under `modules.*`. Everything defaults to `enable = false`. Hosts explicitly opt in. Group attribute sets: use `my = {
    x.y = ...; };`.'
  standalone_containers_adr002: 'No host evaluates its own container closures. Central container-factory builds them; hosts
    pull closures to `/var/lib/machines/<name>/current`. Adding a container requires 4 steps: 1) preset in nix-presets/containers/<name>.nix,
    2) opt-in in host `containers.nix`, 3) entry in nix-config/inventory.nix network.nodes, 4) entry in nix-config/hosts/container-factory/default.nix.'
  impermanence_and_storage: Root (`/`) is tmpfs wiped on boot on workstations/servers. All persistent state MUST be explicitly
    mounted or bound under `/persist` or `/data`. Disko partitions disks into LUKS + Btrfs subvolumes (@root, @nix, @persist,
    @swap).
  secrets_management: Central sops + age store in `kleinbem-secrets`. Cryptographically scoped per path. Hosts use host SSH
    keys or TPM-bound age keys to decrypt at boot. Never commit secrets inline; reference via `config.sops.secrets.<name>.path`.
  vcs_and_multi_agent: Jujutsu (jj) is the primary VCS, colocated with git. When multiple agents work concurrently, each MUST
    claim a dedicated workspace via `just jj::ws-new <repo> [name]` to prevent working copy conflicts. When no YubiKey is
    plugged in, use plain git to avoid signed commit failures.
