# Waveshare ESP32-P4-WIFI6 8" HMI — 800x1280 10-point touch, dual mic,
# speaker, OV5647 MIPI-CSI camera (mipi_csi from esphome/esphome#19480, which
# build.sh pins). One file per physical unit: copy, change `name`. Pins from Waveshare's waveshareteam/ESP32-P4-WIFI6-Touch-LCD-X
# examples (displays_config.h, 09_Audio_Playback, 10_Mic_Record,
# 09_video_lcd_display).
substitutions:
  name: hmi-8in-1
  guest_ssid: !secret wifi_guest_ssid
  guest_pass: !secret wifi_guest_password
  friendly_name: HMI 8in 1
  ha_url: http://10.0.0.21:8123
  # hass-pi's photo-frame service (my.services.photo-frame).
  photo_url: http://10.0.0.21:8099/random.jpg?w=1280&h=800

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - c6_fw.h
    - stations.h
  on_boot:
    priority: -100
    then:
      # Tabs only: no swipe between pages, so no slide animation to redraw.
      - lambda: lv_obj_remove_flag(lv_tabview_get_content(id(tv)), LV_OBJ_FLAG_SCROLLABLE);
      - lambda: c6_fw::start();

esp32:
  board: esp32-p4_r3
  variant: esp32p4
  # The esp32-p4_r3 board defaults to 400MHz, which ESPHome itself flags
  # experimental (no-link: by design); 360MHz is the safe clock.
  cpu_frequency: 360MHz
  flash_size: 32MB
  framework:
    type: esp-idf
    # ESPHome requires this for OTA on 32MB flash.
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz


# Wi-Fi 6 via the on-board ESP32-C6 (SDIO).
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

# Bluetooth also comes from the C6, over the same SDIO link. The panel acts
# as a Bluetooth proxy for Home Assistant.
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

# Firmware of the C6 (Wi-Fi + Bluetooth), from ESPHome's esp-hosted builds.
update:
  - platform: esp32_hosted
    id: c6_update
    name: C6 firmware
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The fallback AP's captive portal can set new Wi-Fi credentials, so it
  # must not be open; the home Wi-Fi password needs no extra secret.
  ap:
    ssid: ${friendly_name} Fallback
    password: !secret wifi_password

api:
  encryption:
    key: !secret api_key_hmi_8in_1
  # Home Assistant can pop a message up on the panel:
  # action esphome.hmi_8in_1_show_message {title, message}
  actions:
    - action: show_message
      variables:
        title: string
        message: string
      then:
        - script.execute:
            id: popup
            title: !lambda return title;
            message: !lambda return message;
ota:
  - platform: esphome
    password: !secret ota_password
logger:
  level: INFO
  # Logs, boot messages and crash dumps also on the USB-C serial bridge.
  hardware_uart: UART0
  logs:
    esp-idf: WARN
captive_portal:

# Touch and both audio codecs share this bus (the camera's SCCB too).
i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz

# The P4's MIPI PHYs (DSI, and CSI for the camera) are powered from
# internal LDO channel 3 at 2.5V.
esp_ldo:
  - id: ldo_mipi_phy
    channel: 3
    voltage: 2.5V

display:
  - platform: mipi_dsi
    id: lcd
    model: WAVESHARE-8-DSI-TOUCH-A
    reset_pin: GPIO27
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_a
    display: lcd
    on_touch:
      - script.execute: wake

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO26
    frequency: 5000Hz
light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON


# OV5647 on the MIPI-CSI connector, via esphome/esphome#19480 (built with
# ESPHome from that PR branch). Shows up in Home Assistant as a camera. The
# DSI display already brings up LDO channel 3, so the camera must not.
mipi_csi:
  name: Camera
  i2c_id: bus_a
  sensor: OV5647
  resolution: 1280x960
  pixel_format: RGB565
  framerate: 10 fps
  sccb_frequency: 400kHz
  init_ldo: false

# Audio: ES8311 DAC (speaker, amp on GPIO53) + ES7210 ADC (dual mic), one
# I2S bus.
i2s_audio:
  - id: i2s_bus
    # Mic and speaker share this bus; full duplex lets music play while the
    # wake word keeps listening.
    full_duplex: true
    i2s_mclk_pin: GPIO13
    i2s_bclk_pin: GPIO12
    i2s_lrclk_pin: GPIO10

audio_dac:
  - platform: es8311
    id: codec_dac
    i2c_id: bus_a
    address: 0x18

audio_adc:
  - platform: es7210
    id: codec_adc
    i2c_id: bus_a
    # Waveshare's own mic example runs the mics at 37.5 dB; ESPHome's 24 dB
    # default left speech at about -56 dB RMS, too quiet for the wake word.
    mic_gain: 37.5db

switch:
  - platform: gpio
    id: speaker_amp
    name: Speaker Amp
    pin: GPIO53
    restore_mode: ALWAYS_ON
  # Clock tab, also in Home Assistant.
  - platform: lvgl
    id: wake_on
    widget: sw_wake
    name: Wake-up alarm
    icon: mdi:alarm
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - script.execute: clock_show
  - platform: lvgl
    id: wake_weekdays
    widget: sw_weekdays
    name: Wake-up on weekdays only
    icon: mdi:calendar-week
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO11
    adc_type: external
    # The ES7210's mic data is on the left slot (Waveshare reads ALL_LEFT);
    # ESPHome's default right slot is silent.
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: spk_hw
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: codec_dac
    sample_rate: 16000
    bits_per_sample: 16bit
  # Announcements and media share the codec through a mixer; announcements
  # duck the media stream.
  - platform: mixer
    id: spk_mixer
    output_speaker: spk_hw
    source_speakers:
      - id: mix_announce
      - id: mix_media
  - platform: resampler
    id: spk_announce
    output_speaker: mix_announce
  - platform: resampler
    id: spk_media
    output_speaker: mix_media

# Audio sources: HTTP for Home Assistant (TTS, sounds, media URLs) and
# Sendspin for Music Assistant, which plays in sync with its other speakers.
# Only requested codecs are built in: FLAC for Home Assistant, MP3 for the
# radio buttons.
audio:
  codecs:
    flac:
    mp3:

# Built-in chime for the alarm clock and the kitchen timer: rings without
# the internet or Home Assistant.
audio_file:
  - id: chime
    file: chime.wav

media_source:
  - platform: audio_http
    id: src_http_announce
    task_stack_in_psram: true
  - platform: audio_http
    id: src_http_media
    task_stack_in_psram: true
  - platform: sendspin
    id: src_sendspin
  - platform: audio_file
    id: src_file

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true
  manufacturer: Waveshare
  model: ESP32-P4-WIFI6 8inch
  # Music Assistant 2.10 pairs without a code; the panel is only on the home LAN.
  unpaired_access: true

# The panel as a media player for Home Assistant and Music Assistant.
media_player:
  - platform: speaker_source
    id: panel_media
    name: Speaker
    announcement_pipeline:
      speaker: spk_announce
      format: FLAC
      num_channels: 1
      sample_rate: 16000
      sources:
        - src_http_announce
        - src_file
    media_pipeline:
      speaker: spk_media
      format: FLAC
      num_channels: 1
      sample_rate: 16000
      sources:
        - src_http_media
        - src_sendspin
    announcement_volume: 70%
    on_state:
      - script.execute: np_mode
      - script.execute: radio_idle
    on_volume:
      - lvgl.slider.update:
          id: sl_vol
          value: !lambda return id(panel_media).volume * 100;
      - if:
          condition:
            lambda: return id(np_local);
          then:
            - lvgl.slider.update:
                id: sl_np_vol
                value: !lambda return id(panel_media).volume * 100;

micro_wake_word:
  # +6 dB digital; 4x clipped normal speech (peaks already near 0 dB).
  microphone:
    microphone: mic
    gain_factor: 2
  models:
    - model: okay_nabu
      probability_cutoff: 0.90
  on_wake_word_detected:
    - script.execute: wake
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  microphone:
    microphone: mic
    gain_factor: 2
  media_player: panel_media
  use_wake_word: false
  on_listening:
    - script.execute: {id: show_voice, text: "Listening…", color: 0x4FC3F7}
  on_stt_vad_end:
    - script.execute: {id: show_voice, text: "Thinking…", color: 0xFFB74D}
  on_tts_start:
    - script.execute: {id: show_voice, text: "Speaking…", color: 0x81C784}
  on_end:
    - script.execute: {id: show_voice, text: "Say \"Okay Nabu\"", color: 0x8A949E}
    - micro_wake_word.start:
  # A failed pipeline start raises on_error but not on_end (no-link: that's
  # voice_assistant's documented event order), so restart the wake word here.
  on_error:
    - script.execute: {id: show_voice, text: "Voice error", color: 0xE57373}
    - delay: 1s
    - if:
        condition: api.connected
        then:
          - micro_wake_word.start:
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:
  # Voice timers ("set a timer for 10 minutes") counted down on screen.
  on_timer_tick:
    - lvgl.label.update:
        id: lbl_timer
        text: !lambda |-
          for (auto &t : timers) {
            if (!t.is_active) continue;
            int s = t.seconds_left;
            return str_sprintf("Timer %d:%02d", s / 60, s % 60);
          }
          return std::string();
  on_timer_finished:
    - lvgl.label.update:
        id: lbl_timer
        text: ""
    - script.execute:
        id: popup
        title: "Timer"
        message: !lambda 'return timer.name.empty() ? std::string("Time is up") : timer.name + " is done";'
  on_timer_cancelled:
    - lvgl.label.update:
        id: lbl_timer
        text: ""

http_request:
  verify_ssl: true

image:
  - platform: online_image
    id: photo
    url: ${photo_url}
    format: JPEG
    type: RGB565
    on_download_finished:
      - lvgl.image.update:
          id: img_photo
          src: photo
  - platform: sendspin
    id: ss_art
    format: JPEG
    type: RGB565
    resize: 420x420
    source: ALBUM
    current_image:
      id: ss_art_img
    on_image_display:
      - lambda: id(ss_has_art) = true;
      - script.execute: np_local_cover
    on_image_clear:
      - lambda: id(ss_has_art) = false;
      - script.execute: np_local_cover
  - platform: online_image
    id: np_cover
    url: ${ha_url}/
    format: AUTO
    type: RGB565
    resize: 420x420
    on_download_finished:
      - if:
          condition:
            lambda: return !id(np_local);
          then:
            - lvgl.image.update:
                id: img_cover
                src: np_cover
            - lvgl.widget.show: img_cover
            - lvgl.widget.hide: lbl_np_nocover
    on_error:
      - lvgl.widget.hide: img_cover
      - lvgl.label.update:
          id: lbl_np_nocover
          text: "\U000F038A"
      - lvgl.widget.show: lbl_np_nocover

font:
  - file: "gfonts://Roboto@300"
    id: font_clock
    size: 200
    glyphs: "0123456789:-"
  - file: "gfonts://Roboto@300"
    id: font_big
    size: 72
    glyphsets: [GF_Latin_Core] # é, ö, ü in titles and station names
  - file: "gfonts://Roboto"
    id: font_mid
    size: 36
    glyphsets: [GF_Latin_Core] # é, ö, ü in titles and station names
  - file: "gfonts://Roboto"
    id: font_small
    size: 26
    glyphsets: [GF_Latin_Core] # é, ö, ü in titles and station names
  - file: "gfonts://Roboto"
    id: font_pin
    size: 64
    glyphs: "•"
  # Material Design Icons (the set Home Assistant uses).
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: font_icon
    size: 64
    glyphs: "󰐹󰒮󰐎󰒭󰎊󰖐󰖙󰖕󰖗󰖖󰖘󰖑󰖝󰖓󰖔󰖒󰌵󰖏󰕥󰔏󰖎󰭬󰍬󰔛󰐲󰀦󰁍󰅂"
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: font_icon_small
    size: 36
    glyphs: "󰖐󰖙󰖕󰖗󰖖󰖘󰖑󰖝󰖓󰖔󰖒󰌵󰖏󰕥󰔏󰖎󰭬󰍬󰔛󰐲󰀦󰁍󰅂󰤠󰅤"

number:
  # Wake-up alarm: the radio fades in up to this volume.
  - platform: template
    id: wake_volume
    name: Wake-up volume
    icon: mdi:volume-high
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: 5
    max_value: 100
    step: 5
    on_value:
      - lvgl.slider.update:
          id: sl_wake_vol
          value: !lambda return x;
  # Volume of voice answers and announcements while no music plays.
  - platform: template
    id: voice_volume
    name: Voice volume
    icon: mdi:account-voice
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 70
    min_value: 0
    max_value: 100
    step: 5
    on_value:
      - speaker_source.set_announcement_volume:
          id: panel_media
          volume: !lambda return x / 100.0f;
      - lvgl.slider.update:
          id: sl_voice
          value: !lambda return x;
  # Noise that wakes the screen, as the mic's RMS level in dB.
  - platform: template
    id: wake_noise
    name: Wake on noise level
    entity_category: config
    unit_of_measurement: dB
    optimistic: true
    restore_value: true
    initial_value: -42
    min_value: -70
    max_value: -10
    step: 1
  - platform: template
    id: bright_day
    name: Screen brightness day
    icon: mdi:brightness-6
    entity_category: config
    min_value: 10
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    initial_value: 100
    restore_value: true
    optimistic: true
    on_value:
      - lvgl.slider.update:
          id: sl_day
          value: !lambda return x;
      - script.execute: wake
  - platform: template
    id: bright_night
    name: Screen brightness night
    icon: mdi:brightness-4
    entity_category: config
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    initial_value: 35
    restore_value: true
    optimistic: true
    on_value:
      - lvgl.slider.update:
          id: sl_night
          value: !lambda return x;
      - script.execute: wake

datetime:
  - platform: template
    id: wake_time
    type: time
    name: Wake-up time
    icon: mdi:alarm
    optimistic: true
    restore_value: true
    initial_value: "07:00"
    time_id: ha_time
    on_time:
      - if:
          condition:
            lambda: |-
              int d = id(ha_time).now().day_of_week; // 1 = Sunday
              return id(wake_on).state && !id(wake_ringing) && (!id(wake_weekdays).state || (d >= 2 && d <= 6));
          then:
            - script.execute: wake_ring
    on_value:
      - script.execute: clock_show

button:
  - platform: template
    id: wake_stop_btn
    name: Stop wake-up alarm
    icon: mdi:alarm-off
    on_press:
      - script.execute: wake_stop

select:
  # Same order as stations.h.
  - platform: template
    id: wake_station
    name: Wake-up station
    icon: mdi:radio
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Radio Mirchi Hindi"
      - "Hits Of Bollywood"
      - "RTÉ Radio 1"
      - "Today FM"
      - "Bayern 3"
      - "1LIVE"
      - "Hitradio Ö3"
      - "FM4"
    initial_option: "RTÉ Radio 1"
    on_value:
      - lvgl.label.update:
          id: lbl_wake_station
          text: !lambda return x;
  # Stops whatever the panel plays after this long, fading out.
  - platform: template
    id: sleep_timer
    name: Sleep timer
    icon: mdi:timer-sand
    optimistic: true
    options: ["Off", "15 min", "30 min", "60 min", "90 min"]
    initial_option: "Off"
    on_value:
      - lambda: |-
          int m = atoi(x.c_str()); // "Off" gives 0
          id(sleep_end) = m ? millis() + m * 60000u : 0;
      - script.execute: clock_tick

globals:
  # Nobody home (HA zone.home = 0): screen stays off.
  - id: away
    type: bool
    initial_value: "false"
  - id: photo_mode
    type: bool
    initial_value: "false"
  # Media tab: true while this panel itself plays (Sendspin), false to show
  # whatever Home Assistant reports for the other speakers.
  - id: np_local
    type: bool
    initial_value: "false"
  - id: ss_has_art
    type: bool
    initial_value: "false"
  # Station started from the Media tab's radio buttons.
  - id: radio_name
    type: std::string
    restore_value: false
  - id: pin
    type: std::string
    restore_value: false
  # Clock tab. Deadlines are millis(), 0 when not running.
  - id: wake_ringing
    type: bool
    initial_value: "false"
  - id: wake_prev_vol
    type: float
    initial_value: "0.5"
  - id: snooze_end
    type: uint32_t
    initial_value: "0"
  - id: kt_end
    type: uint32_t
    initial_value: "0"
  # Kitchen timer seconds while set or paused.
  - id: kt_left
    type: int
    initial_value: "0"
  - id: sleep_end
    type: uint32_t
    initial_value: "0"
  - id: sleep_prev_vol
    type: float
    initial_value: "0.5"

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock
  # The alarm clock also needs the time when Home Assistant is down.
  - platform: sntp
    id: sntp_time
    timezone: Europe/Dublin
    on_time_sync:
      - script.execute: update_clock

script:
  # Like a touch: screen on and the idle timers start over.
  - id: activity
    then:
      - lambda: lv_display_trigger_activity(nullptr);
      - script.execute: wake
  # Nobody home: off until someone comes back.
  - id: go_away
    then:
      - if:
          condition:
            lambda: return id(photo_mode);
          then:
            - script.execute: photo_stop
      - light.turn_off:
          id: backlight
          transition_length: 2s
      - lvgl.pause:
  # Slideshow: day-time screensaver with photos from hass-pi.
  - id: photo_start
    then:
      - lambda: id(photo_mode) = true;
      - online_image.set_url:
          id: photo
          url: !lambda return std::string("${photo_url}&t=") + to_string(millis());
      - lvgl.label.update:
          id: lbl_photo_clock
          text: !lambda |-
            auto t = id(ha_time).now();
            float c = id(ha_weather_temp).state;
            return t.strftime("%H:%M") + (std::isnan(c) ? std::string("") : str_sprintf("   %.0f°", c));
      - lvgl.widget.hide: btn_talk
      - lvgl.page.show:
          id: photo_page
          animation: FADE_IN
          time: 600ms
  # Off a few minutes after the slideshow handed over to the night, unless touched.
  - id: night_off
    mode: restart
    then:
      - delay: 4min
      - if:
          condition:
            lvgl.is_idle:
              timeout: 4min
          then:
            - light.turn_off:
                id: backlight
                transition_length: 2s
            - lvgl.pause:
  - id: photo_stop
    then:
      - lambda: id(photo_mode) = false;
      - lvgl.widget.show: btn_talk
      - lvgl.page.show: main_page
  # Media tab. np_mode decides whose playback to show, np_refresh draws the
  # text, the cover scripts pick the artwork source.
  - id: radio_play
    mode: restart
    parameters:
      i: int
    then:
      - lambda: id(radio_name) = stations::LIST[i].name;
      - media_player.play_media:
          id: panel_media
          media_url: !lambda return stations::LIST[i].url;
      - lambda: id(np_local) = false;
      - script.execute: np_mode
  # Anything else played after a station (HA, Sendspin) must not keep its name;
  # switching stations passes through idle only briefly.
  - id: radio_idle
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            lambda: return id(panel_media).state == media_player::MEDIA_PLAYER_STATE_IDLE && !id(radio_name).empty();
          then:
            - lambda: id(radio_name).clear();
            - script.execute: np_mode
  - id: np_mode
    mode: queued
    then:
      - lambda: |-
          auto st = id(panel_media).state;
          bool local = (st == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                        st == media_player::MEDIA_PLAYER_STATE_PAUSED) &&
                       (!id(ss_title).state.empty() || !id(radio_name).empty());
          if (local == id(np_local)) return;
          id(np_local) = local;
          if (local) {
            lv_slider_set_value(id(sl_np_vol), id(panel_media).volume * 100, LV_ANIM_OFF);
            id(np_local_cover).execute();
          } else {
            id(np_ha_cover).execute();
          }
      - script.execute: np_refresh
  - id: np_refresh
    mode: queued
    then:
      - lvgl.label.update:
          id: lbl_np_title
          text: !lambda |-
            if (id(np_local)) return id(radio_name).empty() ? id(ss_title).state : id(radio_name);
            if (id(np_player).state.rfind("media_player.", 0) != 0 || id(np_title).state == "-")
              return std::string("Nothing playing");
            return id(np_title).state;
      - lvgl.label.update:
          id: lbl_np_artist
          text: !lambda |-
            if (id(np_local)) return id(radio_name).empty() ? id(ss_artist).state : std::string("Radio");
            if (id(np_player).state.rfind("media_player.", 0) != 0 || id(np_artist).state == "-")
              return std::string("");
            return id(np_artist).state;
      - lvgl.label.update:
          id: lbl_np_player
          text: !lambda |-
            if (id(np_local)) return std::string("on this panel");
            if (id(np_player).state.rfind("media_player.", 0) != 0) return std::string("");
            return "on " + id(np_player).state.substr(13);
      - script.execute: np_progress
  - id: np_progress
    then:
      - lambda: |-
          float d = id(ss_duration).state, p = id(ss_progress).state;
          // Live radio has no length; a Sendspin track's duration may linger.
          if (!id(np_local) || !id(radio_name).empty() || std::isnan(d) || d <= 0) {
            lv_obj_add_flag(id(bar_np_progress), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          lv_obj_remove_flag(id(bar_np_progress), LV_OBJ_FLAG_HIDDEN);
          int v = std::isnan(p) ? 0 : (int) (1000.0f * p / d);
          lv_bar_set_value(id(bar_np_progress), std::clamp(v, 0, 1000), LV_ANIM_OFF);
  - id: np_local_cover
    then:
      - if:
          condition:
            lambda: return id(np_local) && id(ss_has_art) && id(radio_name).empty();
          then:
            - lvgl.image.update:
                id: img_cover
                src: ss_art_img
            - lvgl.widget.show: img_cover
            - lvgl.widget.hide: lbl_np_nocover
          else:
            - if:
                condition:
                  lambda: return id(np_local);
                then:
                  - lvgl.widget.hide: img_cover
                  - lvgl.label.update:
                      id: lbl_np_nocover
                      text: !lambda 'return std::string(id(radio_name).empty() ? "\U000F038A" : "\U000F0439");'
                  - lvgl.widget.show: lbl_np_nocover
  - id: np_ha_cover
    then:
      - if:
          condition:
            lambda: return !id(np_local) && id(np_picture).state.rfind("/", 0) == 0;
          then:
            - online_image.set_url:
                id: np_cover
                url: !lambda return std::string("${ha_url}") + id(np_picture).state;
          else:
            - if:
                condition:
                  lambda: return !id(np_local);
                then:
                  - lvgl.widget.hide: img_cover
                  - lvgl.label.update:
                      id: lbl_np_nocover
                      text: "\U000F038A"
                  - lvgl.widget.show: lbl_np_nocover
  # The buttons switch at once; if Home Assistant has not confirmed the new
  # state 2.5s later, they go back to what it reports.
  - id: sync_light
    mode: restart
    then:
      - delay: 2.5s
      - lvgl.widget.update:
          id: btn_light
          state:
            checked: !lambda return id(ha_light).state;
  - id: sync_pump
    mode: restart
    then:
      - delay: 2.5s
      - lvgl.widget.update:
          id: btn_pump
          state:
            checked: !lambda return id(ha_pump).state;
  - id: talk
    then:
      - if:
          condition: voice_assistant.is_running
          then:
            - voice_assistant.stop:
          else:
            - script.execute: wake
            - micro_wake_word.stop:
            - voice_assistant.start:
  - id: update_clock
    then:
      - lvgl.label.update:
          id: lbl_time
          text: !lambda return id(ha_time).now().strftime("%H:%M");
      - lvgl.label.update:
          id: lbl_date
          text: !lambda return id(ha_time).now().strftime("%A, %d %B");
  - id: show_voice
    parameters:
      text: string
      color: int
    then:
      - lvgl.label.update:
          id: lbl_voice
          text: !lambda return text;
          text_color: !lambda return lv_color_hex(color);
  - id: pin_show
    then:
      - lvgl.label.update:
          id: lbl_pin
          text: !lambda |-
            std::string d;
            for (size_t i = 0; i < id(pin).size(); i++) d += "•";
            return d;
  # Screen on at day/night brightness; resumes LVGL if the screensaver paused it.
  - id: wake
    then:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
      - light.turn_on:
          id: backlight
          brightness: !lambda |-
            auto h = id(ha_time).now().hour;
            bool night = h >= 22 || h < 7;
            return (night ? id(bright_night).state : id(bright_day).state) / 100.0f;
          transition_length: 300ms
  - id: popup
    mode: restart
    parameters:
      title: string
      message: string
    then:
      - script.execute: wake
      - lvgl.label.update:
          id: lbl_msg_title
          text: !lambda return title;
      - lvgl.label.update:
          id: lbl_msg_body
          text: !lambda return message;
      - lvgl.widget.update:
          id: msg_box
          hidden: false
      - logger.log: "pop-up shown"
      - delay: 60s
      - lvgl.widget.hide: msg_box
  # Alarm clock: the chosen station fades in; the built-in chime takes over
  # if the stream doesn't start. Stops by itself after 30 minutes.
  - id: wake_ring
    mode: restart
    then:
      - lambda: |-
          if (!id(wake_ringing)) id(wake_prev_vol) = id(panel_media).volume;
          id(wake_ringing) = true;
          id(snooze_end) = 0;
      - if:
          condition:
            lambda: return id(photo_mode);
          then:
            - script.execute: photo_stop
      - script.execute: activity
      - lvgl.label.update:
          id: lbl_ring_station
          text: !lambda return id(wake_station).current_option();
      - lvgl.widget.show: wake_box
      - script.execute: clock_show
      - logger.log: "wake-up alarm"
      - media_player.volume_set:
          id: panel_media
          volume: 5%
      - script.execute:
          id: radio_play
          i: !lambda return id(wake_station).active_index().value_or(2);
      - script.execute: wake_fade
      - delay: 20s
      - if:
          condition:
            lambda: return id(panel_media).state != media_player::MEDIA_PLAYER_STATE_PLAYING;
          then:
            - logger.log: "wake-up stream did not start, chime instead"
            - speaker_source.set_announcement_volume:
                id: panel_media
                volume: !lambda return id(wake_volume).state / 100.0f;
            - repeat:
                count: 360 # 30 minutes
                then:
                  - script.execute: play_chime
                  - delay: 5s
          else:
            - delay: 30min
      - script.execute: wake_stop
  - id: wake_fade
    mode: restart
    then:
      - while:
          condition:
            lambda: return id(wake_ringing) && id(panel_media).volume < id(wake_volume).state / 100.0f - 0.005f;
          then:
            - delay: 2s
            - media_player.volume_set:
                id: panel_media
                volume: !lambda return std::min(id(panel_media).volume + 0.02f, id(wake_volume).state / 100.0f);
  # Also cancels a snooze; leaves other playback alone when nothing rings.
  - id: wake_stop
    then:
      - lambda: id(snooze_end) = 0;
      - if:
          condition:
            lambda: return id(wake_ringing);
          then:
            - script.stop: wake_ring
            - script.stop: wake_fade
            - lambda: id(wake_ringing) = false;
            - lvgl.widget.hide: wake_box
            - media_player.stop: panel_media
            - media_player.volume_set:
                id: panel_media
                volume: !lambda return id(wake_prev_vol);
            - speaker_source.set_announcement_volume:
                id: panel_media
                volume: !lambda return id(voice_volume).state / 100.0f;
      - script.execute: clock_show
  - id: wake_snooze
    then:
      - script.execute: wake_stop
      - lambda: id(snooze_end) = millis() + 9 * 60000u;
      - script.execute: clock_show
  - id: play_chime
    then:
      - media_player.play_media:
          id: panel_media
          media_url: "audio-file://chime"
          announcement: true
  - id: kt_ring
    then:
      - script.execute:
          id: popup
          title: "Kitchen timer"
          message: "Time is up"
      - repeat:
          count: 3
          then:
            - script.execute: play_chime
            - delay: 2500ms
  # Sleep timer ran out: fade out over about 30 seconds, then stop.
  - id: sleep_fade
    then:
      - lambda: id(sleep_prev_vol) = id(panel_media).volume;
      - while:
          condition:
            lambda: return id(panel_media).volume > 0.02f;
          then:
            - media_player.volume_set:
                id: panel_media
                volume: !lambda return std::max(id(panel_media).volume - id(sleep_prev_vol) / 15, 0.0f);
            - delay: 2s
      - media_player.stop: panel_media
      - media_player.volume_set:
          id: panel_media
          volume: !lambda return id(sleep_prev_vol);
  # Clock tab and Home tab texts for the alarm, snooze and kitchen timer.
  - id: clock_show
    then:
      - lambda: |-
          auto hm = str_sprintf("%02d:%02d", id(wake_time).hour, id(wake_time).minute);
          lv_label_set_text(id(lbl_wake_time), hm.c_str());
          std::string home;
          if (id(snooze_end)) {
            int left = (int32_t) (id(snooze_end) - millis()) / 1000;
            home = str_sprintf("Snoozed, %d:%02d", std::max(left, 0) / 60, std::max(left, 0) % 60);
          } else if (id(wake_on).state) {
            home = "Wake-up " + hm;
          }
          int k = id(kt_end) ? (int32_t) (id(kt_end) - millis()) / 1000 + 1 : id(kt_left);
          k = std::max(k, 0);
          auto kt = str_sprintf("%d:%02d", k / 60, k % 60);
          lv_label_set_text(id(lbl_kt), kt.c_str());
          lv_label_set_text(id(lbl_kt_go), id(kt_end) ? "Pause" : "Start");
          if (id(kt_end) || id(kt_left)) home += (home.empty() ? "" : "   ") + std::string("Kitchen ") + kt;
          lv_label_set_text(id(lbl_clock_home), home.c_str());
          std::string sl = "Off";
          if (id(sleep_end)) {
            int m = ((int32_t) (id(sleep_end) - millis()) + 59999) / 60000;
            sl = str_sprintf("Stops in %d min", std::max(m, 0));
          }
          lv_label_set_text(id(lbl_sleep), sl.c_str());
          if (id(wake_ringing)) lv_label_set_text(id(lbl_ring_time), id(ha_time).now().strftime("%H:%M").c_str());
  # Once a second: deadlines of the snooze, kitchen and sleep timers.
  - id: clock_tick
    then:
      - lambda: |-
          auto due = [](uint32_t end) { return end && (int32_t) (millis() - end) >= 0; };
          if (due(id(snooze_end))) {
            id(snooze_end) = 0;
            id(wake_ring).execute();
          }
          if (due(id(kt_end))) {
            id(kt_end) = 0;
            id(kt_left) = 0;
            id(kt_ring).execute();
          }
          if (due(id(sleep_end))) {
            id(sleep_end) = 0;
            auto call = id(sleep_timer).make_call();
            call.set_option("Off");
            call.perform();
            id(sleep_fade).execute();
          }
      - script.execute: clock_show

text_sensor:
  - platform: debug
    reset_reason:
      id: info_reset
      name: Last reset reason
  - platform: version
    name: ESPHome version
    hide_timestamp: false
  # Media tab: HA template helpers "Now playing ..." pick the playing player.
  - platform: homeassistant
    id: np_player
    entity_id: sensor.now_playing_player
    on_value:
      - script.execute: np_refresh
  - platform: homeassistant
    id: np_title
    entity_id: sensor.now_playing_title
    on_value:
      - script.execute: np_refresh
  - platform: homeassistant
    id: np_artist
    entity_id: sensor.now_playing_artist
    on_value:
      - script.execute: np_refresh
  - platform: homeassistant
    id: np_picture
    entity_id: sensor.now_playing_picture
    on_value:
      - script.execute: np_ha_cover
  # What this panel plays via Sendspin (Music Assistant).
  - platform: sendspin
    id: ss_title
    type: title
    internal: true
    on_value:
      - lambda: if (!x.empty()) id(radio_name).clear();
      - script.execute: np_mode
  - platform: sendspin
    id: ss_artist
    type: artist
    internal: true
    on_value:
      - script.execute: np_refresh
  # Wi-Fi tab: current network and the network list for the dropdown.
  - platform: wifi_info
    ssid:
      id: wifi_ssid_now
      on_value:
        - lvgl.label.update:
            id: lbl_wifi_now
            text: !lambda 'return "Connected to " + x + "  " + id(wifi_ip_now).state;'
    ip_address:
      id: wifi_ip_now
      on_value:
        - lvgl.label.update:
            id: lbl_wifi_now
            text: !lambda 'return "Connected to " + id(wifi_ssid_now).state + "  " + x;'
    mac_address:
      id: info_mac
      name: MAC address
    bssid:
      id: info_bssid
      name: Wi-Fi access point
      entity_category: diagnostic
    power_save_mode:
      id: info_psm
      internal: true
    scan_results:
      id: wifi_scan
      internal: true
      on_value:
        - lambda: |-
            // "ssid: -60dB" per line, strongest first; keep each SSID once.
            std::vector<std::string> seen;
            std::string opts;
            size_t pos = 0;
            while (pos < x.size()) {
              size_t nl = x.find('\n', pos);
              if (nl == std::string::npos) nl = x.size();
              std::string line = x.substr(pos, nl - pos);
              pos = nl + 1;
              size_t c = line.rfind(": ");
              if (c == std::string::npos || c == 0) continue;
              std::string ssid = line.substr(0, c);
              if (std::find(seen.begin(), seen.end(), ssid) != seen.end()) continue;
              seen.push_back(ssid);
              if (!opts.empty()) opts += "\n";
              opts += ssid;
            }
            if (!opts.empty()) lv_dropdown_set_options(id(dd_ssid)->obj, opts.c_str());
        - lvgl.label.update:
            id: lbl_wifi_msg
            text: ""
  - platform: homeassistant
    id: ha_weather
    entity_id: weather.forecast_home
    on_value:
      - lvgl.label.update:
          id: lbl_weather_cond
          text: !lambda |-
            std::string s = x;
            for (auto &c : s) if (c == '-' || c == '_') c = ' ';
            if (!s.empty()) s[0] = toupper(s[0]);
            return s;
      - lvgl.label.update:
          id: lbl_weather_icon
          text: !lambda |-
            std::string s = x;
            if (s == "sunny") return std::string("󰖙");
            if (s == "clear-night") return std::string("󰖔");
            if (s == "partlycloudy") return std::string("󰖕");
            if (s == "rainy") return std::string("󰖗");
            if (s == "pouring") return std::string("󰖖");
            if (s == "snowy" || s == "snowy-rainy") return std::string("󰖘");
            if (s == "fog") return std::string("󰖑");
            if (s == "windy" || s == "windy-variant") return std::string("󰖝");
            if (s == "lightning" || s == "lightning-rainy") return std::string("󰖓");
            if (s == "hail") return std::string("󰖒");
            return std::string("󰖐");
  - platform: homeassistant
    id: ha_alarm
    entity_id: alarm_control_panel.alarmo
    on_value:
      # Home Assistant's state colours: armed green, arming/pending orange,
      # triggered red, disarmed grey.
      - lambda: |-
          uint32_t c = 0x8A949E;
          if (x.rfind("armed_", 0) == 0) c = 0x4CAF50;
          else if (x == "arming" || x == "pending") c = 0xFF9800;
          else if (x == "triggered") c = 0xF44336;
          lv_obj_set_style_text_color(id(lbl_alarm), lv_color_hex(c), 0);
          lv_obj_set_style_text_color(id(lbl_alarm_icon), lv_color_hex(c), 0);
      - lvgl.label.update:
          id: lbl_alarm
          text: !lambda |-
            std::string s = x;
            if (s == "disarmed") s = "Disarmed";
            else if (s == "armed_home") s = "Armed home";
            else if (s == "armed_away") s = "Armed away";
            else if (s == "armed_night") s = "Armed night";
            else if (s == "arming") s = "Arming…";
            else if (s == "pending") s = "Pending – enter code";
            else if (s == "triggered") s = "TRIGGERED";
            return s;
      - lvgl.label.update:
          id: lbl_alarm_state
          text: !lambda |-
            std::string s = x;
            if (s == "disarmed") s = "Disarmed";
            else if (s == "armed_home") s = "Armed home";
            else if (s == "armed_away") s = "Armed away";
            else if (s == "armed_night") s = "Armed night";
            else if (s == "arming") s = "Arming…";
            else if (s == "pending") s = "Pending – enter code";
            else if (s == "triggered") s = "TRIGGERED";
            return s;
          text_color: !lambda |-
            if (x == "disarmed") return lv_color_hex(0x81C784);
            if (x == "armed_home" || x == "arming" || x == "pending") return lv_color_hex(0xFFB74D);
            return lv_color_hex(0xE57373);
      - if:
          condition:
            lambda: return x == "triggered" || x == "pending";
          then:
            - script.execute:
                id: popup
                title: "Alarm"
                message: !lambda 'return x == "triggered" ? std::string("Alarm triggered!") : std::string("Enter code to disarm");'
            - lambda: lv_tabview_set_active(id(tv), lv_obj_get_index(id(tile_alarm)), LV_ANIM_OFF);

