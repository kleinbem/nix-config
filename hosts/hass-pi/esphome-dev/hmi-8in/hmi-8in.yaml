# Mic level, for checking placement and gain from Home Assistant.
debug:
  update_interval: 30s

sensor:
  # People at home; unknown or unavailable counts as home.
  - platform: homeassistant
    id: ha_home_count
    entity_id: zone.home
    on_value:
      - lambda: |-
          bool was_away = id(away);
          id(away) = !std::isnan(x) && x < 0.5f;
          if (id(away) && !was_away) id(go_away).execute();
          if (!id(away) && was_away) id(activity).execute();
  - platform: sendspin
    id: ss_progress
    type: track_progress
    internal: true
    update_interval: 1s
    on_value:
      - script.execute: np_progress
  - platform: sendspin
    id: ss_duration
    type: track_duration
    internal: true
  - platform: wifi_signal
    id: info_rssi
    name: Wi-Fi signal
    update_interval: 30s
  - platform: debug
    free:
      id: info_heap
      name: Free heap
    psram:
      id: info_psram
      name: Free PSRAM
    loop_time:
      id: info_loop
      name: Loop time
  - platform: sound_level
    microphone:
      microphone: mic
    # Keeps the mic open without Home Assistant, so the level bar and the
    # noise wake-up don't depend on the wake word running.
    passive: false
    measurement_duration: 1s
    peak:
      name: Mic peak
      entity_category: diagnostic
    rms:
      name: Mic RMS
      entity_category: diagnostic
      on_value:
        - lvgl.bar.update:
            id: bar_mic
            value: !lambda return std::clamp((int) (x + 80), 0, 60);
        # Someone talking or moving nearby wakes the screen. Not while the
        # panel plays (it would hear itself) or nobody is home.
        - if:
            condition:
              lambda: |-
                return !id(away) && x > id(wake_noise).state &&
                       id(panel_media).state == media_player::MEDIA_PLAYER_STATE_IDLE &&
                       lv_display_get_inactive_time(nullptr) > 20000;
            then:
              - script.execute: activity
  - platform: homeassistant
