      bg_color: 0x000000
      widgets:
        - image:
            id: img_photo
            align: CENTER
            src: photo
        - label:
            id: lbl_photo_clock
            align: BOTTOM_LEFT
            x: 40
            y: -30
            text_font: font_big
            text_color: 0xFFFFFF
            shadow_width: 24
            shadow_color: 0x000000
            shadow_opa: 80%
            text: "--:--"
        # Any tap ends the slideshow; this covers the page, so nothing below is pressed.
        - button:
            align: CENTER
            width: 100%
            height: 100%
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            on_click:
              - script.execute: photo_stop

interval:
  - interval: 1s
    then:
      - script.execute: clock_tick
  - interval: 60s
    then:
      - if:
          condition:
            lambda: return id(photo_mode);
          then:
            - if:
                condition:
                  lambda: auto h = id(ha_time).now().hour; return h >= 22 || h < 7;
                then:
                  # Night came during the slideshow: hand over to the night screensaver.
                  - script.execute: photo_stop
                  - light.turn_on:
                      id: backlight
                      brightness: 25%
                      transition_length: 2s
                  - script.execute: night_off
                else:
                  - online_image.set_url:
                      id: photo
                      url: !lambda return std::string("${photo_url}&t=") + to_string(millis());
                  - lvgl.label.update:
                      id: lbl_photo_clock
                      text: !lambda |-
                        auto t = id(ha_time).now();
                        float c = id(ha_weather_temp).state;
                        return t.strftime("%H:%M") + (std::isnan(c) ? std::string("") : str_sprintf("   %.0f°", c));
  # The Orbi can lose its forwarding entry for the panel: wired hosts (Home
  # Assistant) can't reach it while Wi-Fi clients still can, and rejoining the
  # same AP doesn't help. Steering a reconnect to another AP does.
  # no-link: Netgear Orbi firmware has no public bug tracker.
  - interval: 1min
    then:
      - if:
          condition:
            lambda: |-
              static uint8_t lost = 0;
              static std::vector<wifi::bssid_t> lowered;
              auto *w = wifi::global_wifi_component;
              if (api::global_api_server->is_connected(true)) {
                for (auto &b : lowered) w->set_sta_priority(b, 0);
                lowered.clear();
                lost = 0;
                return false;
              }
              if (!w->is_connected()) {
                lost = 0;
                return false;
              }
              if (++lost < 10) return false;
              lost = 0;
              auto b = w->wifi_bssid();
              ESP_LOGW("heal", "No Home Assistant for 10 min, reconnecting away from %02X:%02X:%02X:%02X:%02X:%02X",
                       b[0], b[1], b[2], b[3], b[4], b[5]);
              w->set_sta_priority(b, -10);
              if (std::find(lowered.begin(), lowered.end(), b) == lowered.end()) lowered.push_back(b);
              return true;
          then:
            - wifi.disable:
            - delay: 2s
            - wifi.enable:
  - interval: 5s
    then:
      - lambda: |-
          std::string t;
          float rssi = id(info_rssi).state;
          if (!std::isnan(rssi) && rssi < -75) t += "\U000F0920 ";
          if (!api::global_api_server->is_connected(true)) t += "\U000F0164";
          static std::string last = "-";
          if (t != last) {
            last = t;
            lv_label_set_text(id(lbl_status), t.c_str());
          }
      - if:
          condition:
            lambda: return lv_tabview_get_tab_active(id(tv)) == lv_obj_get_index(id(tile_info));
          then:
            - lvgl.label.update:
                id: lbl_info
                text: !lambda |-
                  char bt[Application::BUILD_TIME_STR_SIZE];
                  App.get_build_time_string(bt);
                  uint32_t up = millis() / 1000;
                  auto num = [](sensor::Sensor *s, const char *fmt) {
                    return std::isnan(s->state) ? std::string("-") : str_sprintf(fmt, s->state);
                  };
                  std::string t;
                  t += str_sprintf("Firmware:  ESPHome %s, built %s\n", ESPHOME_VERSION, bt);
                  esp_chip_info_t ci;
                  esp_chip_info(&ci);
                  t += str_sprintf("Chip:  ESP32-P4 rev v%d.%d, %d MHz\n", ci.revision / 100, ci.revision % 100,
                                   CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ);
                  t += std::string(c6_fw::text) + "\n";
                  t += std::string("Bluetooth:  ") +
                       (esp32_ble::global_ble->is_failed() ? "not running (C6 firmware does not answer)" : "running") + "\n";
                  t += "Wi-Fi:  " + id(wifi_ssid_now).state + ", " + num(id(info_rssi), "%.0f dBm") + ", IP " +
                       id(wifi_ip_now).state + ", MAC " + id(info_mac).state + "\n";
                  t += "Access point:  " + id(info_bssid).state + ",  power save " + id(info_psm).state +
                       ",  Home Assistant " + (api::global_api_server->is_connected(true) ? "connected" : "not connected") + "\n";
                  t += str_sprintf("Uptime:  %ud %02uh %02um", up / 86400, (up / 3600) % 24, (up / 60) % 60) +
                       ",  last reset: " + id(info_reset).state + "\n";
                  t += "Memory free:  heap " + num(id(info_heap), "%.0f B") + ",  PSRAM " + num(id(info_psram), "%.0f B") +
                       ",  loop " + num(id(info_loop), "%.0f ms") + "\n";
                  return t;
      - lambda: c6_fw::changed = false;
