lvgl:
  displays: [lcd]
  touchscreens: [touch]
  # Mounted landscape: 1280x800.
  rotation: 90
  bg_color: 0x101418
  text_color: 0xE6EAEE
  style_definitions:
    - id: card
      bg_color: 0x1E242B
      bg_opa: COVER
      radius: 24
      border_width: 0
      pad_all: 20
    - id: muted
      text_color: 0x8A949E
      text_font: font_small
  # Screensaver. By day (7-22) a photo slideshow after two minutes; at night
  # dim after one and off after five (LVGL paused, so the waking touch doesn't
  # press a button). Touch or the wake word bring it back.
  on_idle:
    - timeout: 60s
      then:
        - if:
            condition:
              lambda: auto h = id(ha_time).now().hour; return h >= 22 || h < 7;
            then:
              - light.turn_on:
                  id: backlight
                  brightness: 25%
                  transition_length: 2s
    - timeout: 2min
      then:
        - if:
            condition:
              lambda: auto h = id(ha_time).now().hour; return !id(away) && h >= 7 && h < 22;
            then:
              - script.execute: photo_start
    - timeout: 5min
      then:
        - if:
            condition:
              lambda: auto h = id(ha_time).now().hour; return h >= 22 || h < 7;
            then:
              - light.turn_off:
                  id: backlight
                  transition_length: 2s
              - lvgl.pause:
  # Pop-up for messages from Home Assistant, timers and the alarm.
  top_layer:
    widgets:
      # Shown only when something is wrong: weak Wi-Fi, Home Assistant gone.
      - label:
          id: lbl_status
          align: TOP_RIGHT
          x: -16
          y: 10
          text_font: font_icon_small
          text_color: 0xFF9800
          text: ""
      # Push to talk on every tab: same as saying "Okay Nabu"; tap again to stop.
      - button:
          id: btn_talk
          align: BOTTOM_RIGHT
          x: -12
          y: -6
          width: 120
          height: 60
          radius: 30
          bg_color: 0x1E242B
          shadow_width: 0
