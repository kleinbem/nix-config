    on_value:
      - lvgl.label.update:
          id: lbl_t2_hum
          text: !lambda return str_sprintf("%.0f %%", x);
  - platform: homeassistant
    id: ha_t3_temp
    entity_id: sensor.sbht_003c_fd9f_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_t3_temp
          text: !lambda return str_sprintf("%.1f°", x);
  - platform: homeassistant
