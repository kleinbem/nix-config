                      light_color: 0xFFFFFF
                      dark_color: 0x000000
                      # WIFI: QR payloads need \ ; , " : escaped in S: and P:.
                      text: !lambda |-
                        auto esc = [](const std::string &v) {
                          std::string o;
                          for (char c : v) {
                            if (std::string("\\;,\":").find(c) != std::string::npos) o += '\\';
                            o += c;
                          }
                          return o;
                        };
                        return "WIFI:T:WPA;S:" + esc(R"~(${guest_ssid})~") +
                               ";P:" + esc(R"~(${guest_pass})~") + ";;";
