# Waveshare ESP32-P4-WIFI6 8" HMI — 800x1280 10-point touch, dual mic,
# speaker. One file per physical unit: copy, change `name`.
substitutions:
  name: hmi-8in-1
  friendly_name: HMI 8in 1

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-p4_r3
  variant: esp32p4
  # ESPHome defaults the P4 to 400MHz, which it flags experimental
  # (esphome/esphome#13425); 360MHz is the safe clock.
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
  flash_size: 16MB

psram:
  mode: hex
  speed: 200MHz

# Wi-Fi 6 via the on-board ESP32-C6 (SDIO). Pins = Espressif P4 reference
# design; verify against the Waveshare wiki.
esp32_hosted:
  variant: ESP32C6
  slot: 1
  active_high: true
  reset_pin: GPIO54 # verify
  cmd_pin: GPIO19 # verify
  clk_pin: GPIO18 # verify
  d0_pin: GPIO14 # verify
  d1_pin: GPIO15 # verify
  d2_pin: GPIO16 # verify
  d3_pin: GPIO17 # verify

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback

api:
  encryption:
    key: !secret api_key_hmi_8in_1
ota:
  - platform: esphome
    password: !secret ota_password
logger:
  level: INFO
captive_portal:

i2c:
  - id: bus_a
    sda: GPIO7 # verify
    scl: GPIO8 # verify
    frequency: 400kHz

# The P4's MIPI-DSI PHY is powered from internal LDO channel 3 at 2.5V
# (Espressif reference design; same on the Waveshare boards).
esp_ldo:
  - id: ldo_mipi_phy
    channel: 3
    voltage: 2.5V

display:
  - platform: mipi_dsi
    id: lcd
    model: WAVESHARE-8-DSI-TOUCH-A
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_a
    display: lcd

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO23 # verify
light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

# Voice (dual mic + speaker, ES8311/ES7210 over I2S): fill in once the
# audio pins are confirmed, same block as the Smart 86 Box.

lvgl:
  displays: [lcd]
  touchscreens: [touch]
  pages:
    - id: main_page
      widgets:
        - label:
            align: CENTER
            text: ${friendly_name}
