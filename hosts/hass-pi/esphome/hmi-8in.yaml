# Waveshare ESP32-P4-WIFI6 8" HMI. The camera isn't wired up: ESPHome has no
# MIPI-CSI component until esphome/esphome#19480. One file per unit: copy and
# change `name`, `friendly_name` and the api key secret (add it to
# ../esphome-secrets.nix). Pins come from waveshareteam/ESP32-P4-WIFI6-Touch-LCD-X.
substitutions:
  name: hmi-8in-1
  friendly_name: HMI 8in 1

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-p4_r3
  variant: esp32p4
  # ESPHome defaults the P4 to 400MHz, which it flags experimental
  # (esphome/esphome#13425); 360MHz is the safe clock.
  cpu_frequency: 360MHz
  flash_size: 32MB
  framework:
    type: esp-idf
    # ESPHome requires this for OTA on 32MB flash.
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz


# Wi-Fi 6 via the on-board ESP32-C6 (SDIO).
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback

api:
  encryption:
    key: !secret api_key_hmi_8in_1
ota:
  - platform: esphome
    password: !secret ota_password
logger:
  level: INFO
captive_portal:

# Touch and both audio codecs share this bus (the camera's SCCB too).
i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz

# The P4's MIPI PHYs (DSI, and CSI for the camera) are powered from
# internal LDO channel 3 at 2.5V.
esp_ldo:
  - id: ldo_mipi_phy
    channel: 3
    voltage: 2.5V

display:
  - platform: mipi_dsi
    id: lcd
    model: WAVESHARE-8-DSI-TOUCH-A
    reset_pin: GPIO27
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_a
    display: lcd

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO26
    frequency: 5000Hz
light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON


# Audio: ES8311 DAC (speaker, amp on GPIO53) + ES7210 ADC (dual mic), one
# I2S bus.
i2s_audio:
  - id: i2s_bus
    i2s_mclk_pin: GPIO13
    i2s_bclk_pin: GPIO12
    i2s_lrclk_pin: GPIO10

audio_dac:
  - platform: es8311
    id: codec_dac
    i2c_id: bus_a
    address: 0x18

audio_adc:
  - platform: es7210
    id: codec_adc
    i2c_id: bus_a
    # Waveshare's own mic example runs the mics at 37.5 dB; ESPHome's 24 dB
    # default left speech at about -56 dB RMS, too quiet for the wake word.
    mic_gain: 37.5db

switch:
  - platform: gpio
    id: speaker_amp
    name: Speaker Amp
    pin: GPIO53
    restore_mode: ALWAYS_ON

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO11
    adc_type: external
    # The ES7210's mic data is on the left slot (Waveshare reads ALL_LEFT);
    # ESPHome's default right slot is silent.
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: codec_dac
    sample_rate: 16000
    bits_per_sample: 16bit

micro_wake_word:
  microphone: mic
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  microphone: mic
  speaker: spk
  use_wake_word: false
  on_end:
    - micro_wake_word.start:
  # A failed pipeline start raises on_error but not on_end; without this the
  # wake word stays off until Home Assistant reconnects.
  on_error:
    - delay: 1s
    - if:
        condition: api.connected
        then:
          - micro_wake_word.start:
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:

lvgl:
  displays: [lcd]
  touchscreens: [touch]
  pages:
    - id: main_page
      widgets:
        - label:
            align: CENTER
            text: ${friendly_name}

# Mic level, for checking placement and gain from Home Assistant.
sensor:
  - platform: sound_level
    microphone:
      microphone: mic
    passive: true
    measurement_duration: 1s
    peak:
      name: Mic peak
      entity_category: diagnostic
    rms:
      name: Mic RMS
      entity_category: diagnostic
