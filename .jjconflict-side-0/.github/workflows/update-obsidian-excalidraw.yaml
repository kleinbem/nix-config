name: "Update Obsidian Excalidraw Plugin"

# Bumps the pinned zsviczian/obsidian-excalidraw-plugin release referenced in
# users/martin/home.nix. The plugin is 3 plain static assets (main.js,
# manifest.json, styles.css), each pkgs.fetchurl-pinned — nix-prefetch-url
# downloading + hashing each one IS the verification, no build needed.

on:
  schedule:
    # Mondays 05:00 UTC — same slot family as the nix-packages updaters,
    # different day/repo.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: "Bump home.nix & open PR"
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            access-tokens = github.com=${{ steps.app-token.outputs.token }}

      - name: Run updater
        id: update
        run: |
          chmod +x scripts/update-obsidian-excalidraw.sh
          ./scripts/update-obsidian-excalidraw.sh
          if git diff --quiet -- users/martin/home.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            VER=$(grep -oP "excalidraw-plugin/releases/download/\K[0-9.]+" users/martin/home.nix | head -1)
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        id: cpr
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH_NAME="auto-update/obsidian-excalidraw"
          REPO="${{ github.repository }}"
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)

          if gh api "repos/$REPO/git/ref/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" -F force=true >/dev/null
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" >/dev/null
          fi

          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH_NAME" \
            --arg sha "$MAIN_SHA" \
            --arg headline "chore: update obsidian-excalidraw-plugin to ${{ steps.update.outputs.version }}" \
            --arg content "$(base64 -w0 users/martin/home.nix)" \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $headline},
                expectedHeadOid: $sha,
                fileChanges: {additions: [{path: "users/martin/home.nix", contents: $content}]}
            }}}' | gh api graphql --input -

          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<'EOF'
          ## Obsidian Excalidraw plugin update

          Bumps the pinned `zsviczian/obsidian-excalidraw-plugin` release to
          **${{ steps.update.outputs.version }}** in `users/martin/home.nix`.
          Hashes were prefetched directly from the GitHub release assets
          (`main.js`, `manifest.json`, `styles.css`).

          ---
          🤖 Opened automatically by the update-obsidian-excalidraw workflow.
          EOF

          gh pr create \
            --title "chore: update obsidian-excalidraw-plugin to ${{ steps.update.outputs.version }}" \
            --body-file "$BODY_FILE" \
            --head "$BRANCH_NAME" \
            --base main \
            --label dependencies || true

          echo "pull-request-number=$(gh pr view "$BRANCH_NAME" --json number --jq .number)" >> "$GITHUB_OUTPUT"

      # Fully hands-off: nix-prefetch-url downloading + hashing each asset in
      # the updater script is the gate, so squash-merge immediately.
      - name: Auto-merge
        if: steps.update.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR" --squash --delete-branch --auto \
            || gh pr merge "$PR" --squash --delete-branch
