name: "Build nixos-nvme toplevel (best-effort)"

# Warm the cache with every package nixos-nvme would otherwise compile, so
# applies on the workstation substitute instead of compiling. Committed lock +
# real secrets, so the drvs match what the host evaluates.
# Only packages are built, one job per group: the system-assembly steps (etc,
# units, the toplevel) reference the whole ~57 GiB closure but take seconds,
# and the host, which has that closure, builds them itself
# (scripts/heavy-drvs.sh, my.deploy.autoUpgrade.localAssembly).
# No pull_request trigger: without a cache push the build would be wasted.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'terraform/**'
      - 'LICENSE'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

# A newer push queues behind a running build (GitHub keeps the newest pending
# run); what a run built is in Attic either way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ATTR: ".#nixosConfigurations.nixos-nvme.config.system.build.toplevel"

jobs:
  plan:
    name: "Plan uncached packages"
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nix fleet setup (pull-only)
        uses: ./.github/actions/nix-fleet-setup
        with:
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}
          free-disk-space: 'false'

      - name: Initialize commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="pending" \
            -f context="CI/nixos-nvme" \
            -f description="Workstation package build is pending" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mint GitHub App token for kleinbem-secrets
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            kleinbem-secrets
          # Only feeds Nix's github access-token.
          permission-contents: read

      - name: Add swap for the eval
        # The eval peaks around 4.6 GiB, near the hosted runner's memory ceiling.
        run: |
          sudo fallocate -l 12G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci

      - name: List uncached packages
        id: plan
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ steps.app-token.outputs.token }}"
        run: |
          set -euo pipefail
          # always-allow-substitutes: as on the host, so cached
          # allowSubstitutes = false drvs don't count as missing.
          out=$(nix build --no-link --dry-run \
            --option always-allow-substitutes true "$ATTR" 2>&1) || {
            echo "$out"
            exit 1
          }
          classified=$(scripts/heavy-drvs.sh <<<"$out")
          echo "$(grep -c '^heavy ' <<<"$classified" || true) packages to build," \
            "$(grep -c '^small ' <<<"$classified" || true) assembly steps left to the host."
          chunks=$(python3 -I .github/scripts/plan-build-chunks.py <<<"$classified")
          echo "chunks=$chunks" >>"$GITHUB_OUTPUT"

  build:
    name: "Build packages (${{ strategy.job-index }})"
    needs: plan
    if: needs.plan.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        drvs: ${{ fromJSON(needs.plan.outputs.chunks) }}
    outputs:
      cause: ${{ steps.build.outputs.cause }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nix fleet setup
        uses: ./.github/actions/nix-fleet-setup
        with:
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          attic-token: ${{ secrets.ATTIC_PUSH_TOKEN }}
          configure-auto-gc: 'true'
          free-disk-space: 'true'

      - name: Mint GitHub App token for kleinbem-secrets
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            kleinbem-secrets
          permission-contents: read

      - name: Add swap for the eval
        run: |
          sudo fallocate -l 12G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci

      # Each job re-evaluates rather than receiving the drvs as an artifact:
      # this repo is public, and the drv closure can carry private inputs.
      - name: Build this group and push to Attic
        id: build
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ steps.app-token.outputs.token }}"
          DRVS: ${{ matrix.drvs }}
        run: |
          set -euo pipefail
          nix path-info --derivation "$ATTR" >/dev/null
          read -ra drvs <<<"$DRVS"
          for d in "${drvs[@]}"; do
            [ -f "$d" ] || {
              echo "::error::$d not produced by this eval; plan and build evaluated differently."
              exit 1
            }
          done
          attic watch-store system &
          watch=$!
          trap 'kill "$watch" 2>/dev/null || true; wait "$watch" 2>/dev/null || true' EXIT
          MARK=$(mktemp) # failure report scopes to logs written after this
          nix build --no-link --keep-going -L "${drvs[@]/%/^*}" && exit 0
          .github/scripts/report-failed-drvs.sh nixos-nvme "$MARK" system
          exit 1

  # Own job: it also reports a plan failure or a build runner that died.
  report:
    name: "Report nixos-nvme build"
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Result
        id: result
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [ "$PLAN" = success ] && { [ "$BUILD" = success ] || [ "$BUILD" = skipped ]; }; then
            r=success
          elif [ "$PLAN" = cancelled ] || [ "$BUILD" = cancelled ]; then
            r=cancelled
          else
            r=failure
          fi
          echo "result=$r" >>"$GITHUB_OUTPUT"

      # A red build here must reach the phone, not hide behind a green run.
      - name: Alert build failure via ntfy
        if: steps.result.outputs.result == 'failure'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_ALERT_TOPIC }}
          CAUSE: ${{ needs.build.outputs.cause }}
        run: |
          set -euo pipefail
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_ALERT_TOPIC secret not set — skipping alert."
            exit 0
          fi
          curl -fsS --max-time 15 \
            -H "Title: nixos-nvme package build failed (x86_64-linux)" \
            -H "Tags: warning" \
            -H "Priority: default" \
            -d "nixos-nvme packages failed: ${CAUSE:-see the run}. What did build was pushed to Attic; the host's auto-upgrade waits until the rest is cached. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.kleinbem.dev/$NTFY_TOPIC"

      - name: Update commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAUSE: ${{ needs.build.outputs.cause }}
          RESULT: ${{ steps.result.outputs.result }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success) state="success"; desc="Workstation packages are cached" ;;
            # The cause is what `just dev::apply` shows before a local build.
            failure) state="failure"; desc="Workstation package build failed${CAUSE:+: $CAUSE}" ;;
            *) state="error"; desc="Workstation package build was cancelled" ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="CI/nixos-nvme" \
            -f description="${desc:0:140}" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
