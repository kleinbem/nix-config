name: "Build nixos-nvme toplevel (best-effort)"

# Workstation (nixos-nvme) toplevel: CI is the main builder, so warm the
# cache for the workstation too — `just apply` and its nightly autoUpgrade
# then substitute instead of compiling locally. Committed lock + real
# secrets, like the blocking host step in build-all.
#
# Own WORKFLOW, not a job in build-all: this closure is the biggest in the
# fleet (eval ~4.6 GiB, hours of from-source builds) and it has killed the
# hosted x86 runner outright twice — "The hosted runner lost communication
# with the server" after ~4 h (runs 39370850633, 39385551311, 2026-10-20).
# promote-production fires when build-all COMPLETES, and a workflow only
# completes once every job is done, so inside build-all this build delayed
# the production tag and the container manifest by hours and held the
# concurrency group against the next push (run 39431394093). Here it has
# its own group; build-all finishes when the matrix finishes. A failure
# reaches the phone via ntfy and the CI/nixos-nvme commit status, never a
# green build-all. No pull_request trigger: without a cache push the
# artifacts would be thrown away.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'terraform/**'
      - 'LICENSE'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

# Never cancel a running build: the lock bot pushes several times a day and
# this build takes hours. A newer push queues behind it (GitHub keeps the
# newest pending run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-nvme:
    name: "Build nixos-nvme toplevel (best-effort)"
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Nix fleet setup
        uses: ./.github/actions/nix-fleet-setup
        with:
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          attic-token: ${{ secrets.ATTIC_PUSH_TOKEN }}
          configure-auto-gc: 'true'
          free-disk-space: 'true'

      - name: Initialize commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="pending" \
            -f context="CI/nixos-nvme" \
            -f description="Workstation toplevel build is pending" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mint GitHub App token for kleinbem-secrets
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            kleinbem-secrets

      - name: Add swap for the eval
        # The eval runs near the hosted runner's memory ceiling; spill to the
        # SSD instead of getting SIGTERM'd.
        run: |
          sudo fallocate -l 12G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h

      - name: Build nixos-nvme toplevel (best-effort)
        id: nvme-build
        continue-on-error: true
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ steps.app-token.outputs.token }}"
        run: |
          set -o pipefail
          COMMON=(
            "--no-nom"
            "--skip-cached"
            "--eval-workers" "1"
            # nix-fast-build's per-worker eval budget defaults to 4096 MiB and
            # is now enforced as a hard failure ("evaluation exceeded the
            # memory budget"). The eval peaked at 4.6 GiB on 2026-10-19 (10.2
            # GiB before #102 dropped the specialisations). 8 GiB leaves room to
            # grow, and a blowup like that one still fails here early.
            "--eval-max-memory-size" "8192"
            "--systems" "x86_64-linux"
            "--retries" "2"
            "--attic-cache" "system"
          )
          ATTR=".#nixosConfigurations.nixos-nvme.config.system.build.toplevel"
          MARK=$(mktemp) # failure report scopes to logs written after this
          nix run github:Mic92/nix-fast-build -- "${COMMON[@]}" \
            --flake "$ATTR" && exit 0
          .github/scripts/report-failed-drvs.sh nixos-nvme "$MARK"
          exit 1

      # Same alerting as the matrix job's best-effort steps: a red build here
      # must reach the phone, not hide behind a green run.
      - name: Alert build failure via ntfy
        if: always() && steps.nvme-build.outcome == 'failure'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_ALERT_TOPIC }}
        run: |
          set -euo pipefail
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_ALERT_TOPIC secret not set — skipping alert."
            exit 0
          fi
          curl -fsS --max-time 15 \
            -H "Title: best-effort toplevel build failed (x86_64-linux)" \
            -H "Tags: warning" \
            -H "Priority: default" \
            -d "Run stayed green but the nixos-nvme toplevel failed to build from source. Cache is not being warmed for it — the workstation will compile locally until fixed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.kleinbem.dev/$NTFY_TOPIC"

      - name: Update commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ steps.nvme-build.outcome }}" in
            success) state="success"; desc="Workstation toplevel build succeeded" ;;
            failure) state="failure"; desc="Workstation toplevel build failed" ;;
            cancelled) state="error"; desc="Workstation toplevel build was cancelled" ;;
            *) state="error"; desc="Workstation toplevel build was skipped or errored" ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="CI/nixos-nvme" \
            -f description="$desc" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
