name: "Promote → production"

# Pull-based fleet deploy: hosts run my.deploy.autoUpgrade which polls the
# `production` git tag. This workflow advances that tag to the current main
# SHA after a successful build-all, gating deploys behind CI green.
#
# Triggers:
# - workflow_run: automatic on successful Build & Cache All (Fast)
# - workflow_dispatch: manual override (e.g. promote without waiting)
#
# A failed build-all does NOT advance the tag — hosts keep running the last
# known-good revision until the next green run.

on:
  workflow_run:
    workflows: ["Build & Cache All (Fast)"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      sha:
        description: "Override SHA to promote (default: latest main)"
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Device-faithful completeness gate. A host that opts into
  # my.deploy.autoUpgrade pulls the `production` tag and switches — and MUST
  # never compile on-device (RPi hosts carry the custom linux-rpi kernel, which
  # is absent from cache.nixos.org). build-all already builds + pushes those
  # toplevels, but a push can be partial (network blip mid-NAR, a path
  # nix-fast-build didn't push, Attic GC racing). This job proves, from a clean
  # store using EXACTLY the substituters a device trusts (cache.nixos.org +
  # cachix mirrors + private Attic), that every deployed closure is fully
  # fetchable. If anything "will be built", we refuse to advance the tag — hosts
  # keep running the last fully-cached revision instead of risking an on-device
  # build. This is what makes the setup-only Attic push (skip-push) safe: Attic
  # holds only non-upstream paths, and this gate verifies the union still covers
  # the whole closure.
  verify-cache:
    name: "Verify closures are fully cached"
    # Runner arch doesn't matter here: `nix build --dry-run` never executes a
    # builder, it only queries substituters and classifies each path as
    # fetchable or not — verified cross-arch locally (dry-running an
    # aarch64-linux target from an x86_64-linux machine correctly classified
    # all 446 derivations, no arch-mismatch error). Stayed on aarch64 as the
    # historical default now that hosts span both arches (mac-mini added
    # 2026-08-02); revisit only if a real quirk shows up.
    runs-on: ubuntu-24.04-arm
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout promotion-candidate SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Check the exact commit build-all built, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Nix fleet setup (pull-only)
        # Wires up NetBird + Attic as a SUBSTITUTER with the pull token and
        # sets NIX_OVERRIDES to the same
        # github: sibling refs build-all used — so the closure we evaluate here
        # matches the one that was cached.
        uses: ./.github/actions/nix-fleet-setup
        with:
          # Ephemeral key only: runner peers land in ci-runners (cache-only
          # policy) and auto-expire after the run.
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}
          free-disk-space: 'false'

      # Lock-honesty gate: every check in this job so far evaluates with
      # nix-presets (and siblings) floated to their latest main via
      # $NIX_OVERRIDES — useful for catching cross-repo breakage early, but it
      # means CI never actually builds what a device resolves
      # (`nixos-rebuild switch --flake github:kleinbem/nix-config?ref=production`,
      # zero overrides). A stale flake.lock can sail through every overridden
      # check and still crash on-device — exactly what happened 2026-09-22:
      # nix-presets gained a `gatus` module, this repo's committed lock
      # wasn't bumped, and every autoUpgrade attempt on core-pi failed with
      # "attribute 'gatus' missing" until the lock was fixed by hand. Force a
      # full eval of every autoUpgrade host using ONLY the committed lock —
      # no $NIX_OVERRIDES at all — so this class of bug blocks promotion
      # instead of reaching a device.
      #
      # That "no overrides" honesty is exactly why this step (alone in the
      # job) needs its own github.com auth: kleinbem-secrets is a private
      # repo, so the unauthenticated `github:` fetcher 404s on it the same
      # way an anonymous `curl` would — confirmed live 2026-09-24, blocking
      # every promotion since this gate was added. Real devices solve this
      # with their own sops-decrypted github_read_all_token wired into
      # nix.conf's access-tokens (core.nix) — mint the equivalent here via
      # the same GitHub App the `promote` job below already uses.
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Without this, create-github-app-token defaults to scoping the
          # token to ONLY the current repo (nix-config) — confirmed live
          # 2026-09-24 via its own log ("Inputs 'owner' and 'repositories'
          # are not set. Creating token for this repository."), which is
          # exactly why the first version of this fix still 404'd on
          # kleinbem-secrets despite minting a token successfully.
          repositories: |
            kleinbem-secrets

      - name: Assert committed flake.lock evaluates (no overrides)
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ steps.app-token.outputs.token }}"
        run: |
          set -euo pipefail
          # Every host with my.deploy.autoUpgrade.enable — these are the ones
          # that resolve flake inputs strictly via the committed lock, with
          # no override, when they pull the `production` ref themselves.
          HOSTS=(nixos-nvme orin-nano core-pi hass-pi nasbook mac-mini)
          fail=0
          for h in "${HOSTS[@]}"; do
            echo "::group::honest eval $h"
            target=".#nixosConfigurations.$h.config.system.build.toplevel.drvPath"
            if ! out="$(nix eval --json "$target" 2>&1)"; then
              echo "$out"
              echo "::error::$h: fails to evaluate against the COMMITTED flake.lock (no overrides) — this is what a real device would hit. Blocking promotion."
              fail=1
            else
              echo "✅ $h: evaluates cleanly against the committed lock."
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Assert no deployed host would build
        env:
          # Same App token as the eval gate: the device closure includes the
          # private kleinbem-secrets input.
          NIX_CONFIG: "access-tokens = github.com=${{ steps.app-token.outputs.token }}"
        run: |
          set -euo pipefail
          # The hosts that pull `production` via my.deploy.autoUpgrade with
          # requireCache = true: since 2026-10-20 they run `nixos-rebuild
          # --max-jobs 0`, so anything missing from the cache fails their
          # upgrade outright. Mirrors build-all's committed-lock step
          # (hass-pi/core-pi on aarch64, mac-mini/nasbook on x86_64).
          # Excluded (deliberately, same as build-all): nixos-nvme (best-effort
          # build, Martin deploys it by hand), orin-nano + routers (build
          # on-device by design). Edit this list as hosts opt into pull-deploy.
          #
          # Resolved WITHOUT $NIX_OVERRIDES: committed lock, real secrets —
          # the exact closure the device evaluates. Checking the floated
          # closure instead (as this step did until 2026-10-20) let a lagging
          # lock through every time; the device then compiled until
          # RuntimeMaxSec killed it.
          HOSTS=(hass-pi core-pi mac-mini nasbook)
          fail=0
          for h in "${HOSTS[@]}"; do
            echo "::group::dry-run $h"
            target=".#nixosConfigurations.$h.config.system.build.toplevel"
            # Run exactly what a device runs: `--max-jobs 0` plus
            # `always-allow-substitutes` (nixpkgs marks system-path, etc,
            # system-units and every writeText* `allowSubstitutes = false`;
            # without the option Nix reports "will be built" for cached
            # paths, which is what fooled the 2026-09-30 flake-attr check,
            # and the devices failed the same way on 2026-10-21). Anything
            # the runner's substituters (Attic + upstreams) cannot provide
            # shows up as "will be built"; a path only in the local store
            # of the runner cannot happen here (fresh runner, nothing built).
            if ! out="$(nix build --dry-run --max-jobs 0 \
                  --option always-allow-substitutes true "$target" 2>&1)"; then
              echo "$out"
              echo "::error::$h: dry-run failed — cannot verify cache, refusing to promote."
              fail=1
              echo "::endgroup::"
              continue
            fi
            echo "$out" | grep -vE '^(evaluation warning|warning):' || true
            if echo "$out" | grep -qE 'will be built|do.?n.?t know how to build'; then
              echo "::error::$h closure is NOT fully cached — the device's --max-jobs 0 upgrade would fail. Blocking promotion."
              fail=1
            else
              echo "✅ $h: fully cached (fetch-only)."
            fi
            echo "::endgroup::"
          done
          exit $fail

      # Container manifest: the standalone container updater on every host
      # (nixos-nvme, core-pi, hass-pi) is eval-free — it fetches this JSON and
      # substitutes the listed store path. Generate it here from the SAME SHA
      # being promoted, and apply the same device-faithful gate as hosts: a
      # container path that isn't fully cached is DROPPED from the manifest
      # (devices then keep serving the previous closure) rather than published
      # as a path an RPi would have to compile. Manifest generation is
      # best-effort overall: it must never block host promotion.
      - name: Generate container manifest
        id: manifest
        continue-on-error: true
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo '{}' > /tmp/systems.json
          for entry in "x86_64-linux:container-factory" "aarch64-linux:container-factory-aarch64"; do
            sys="${entry%%:*}"; factory="${entry##*:}"
            echo "::group::manifest $sys ($factory)"
            nix eval --json \
              ".#nixosConfigurations.$factory.config.containers" \
              --apply 'cs: builtins.mapAttrs (n: c: c.path) cs' \
              $NIX_OVERRIDES > "/tmp/paths-$sys.json"
            # Device-faithful filter: same dry-run gate as hosts, per container.
            # Checks the FULL closure (root + deps) against the substituters a
            # device trusts; repeated evals share the flake eval cache.
            #
            # Uses `nix path-info -r` on the already-resolved literal $path,
            # NOT `nix build --dry-run` on the flake attribute — see the
            # matching, longer comment on the host dry-run step above for
            # why: the flake-attr form silently misreports genuinely-cached
            # closures as needing a build (the original empty-manifest bug),
            # and `nix build --dry-run` on a literal path crashes the Nix
            # daemon outright on this runner. `path-info -r` gives the same
            # correct signal as neither of those, safely. Exit code is
            # ignored (path-info always exits non-zero here — the path
            # isn't actually realized locally); a miss is either phrasing,
            # "will be built" or "don't know how to build" (no flake
            # attribute means no build recipe to fall back to).
            echo '{}' > "/tmp/ok-$sys.json"
            for name in $(jq -r 'keys[]' "/tmp/paths-$sys.json"); do
              path=$(jq -r --arg n "$name" '.[$n]' "/tmp/paths-$sys.json")
              out="$(nix path-info -r "$path" $NIX_OVERRIDES --option substituters "https://cache.nixos.org https://cache.kleinbem.dev/system" 2>&1 || true)"
              if echo "$out" | grep -qiE 'will be built|do.?n.?t know how to build'; then
                echo "::warning::$sys/$name closure not fully cached ($path) — dropped from manifest this cycle."
                echo "$out"
              else
                jq --arg n "$name" --arg p "$path" '. + {($n): $p}' "/tmp/ok-$sys.json" > /tmp/ok.tmp && mv /tmp/ok.tmp "/tmp/ok-$sys.json"
              fi
            done
            jq --arg s "$sys" --slurpfile m "/tmp/ok-$sys.json" '. + {($s): $m[0]}' /tmp/systems.json > /tmp/systems.tmp && mv /tmp/systems.tmp /tmp/systems.json
            echo "::endgroup::"
          done
          jq -n --arg rev "$SHA" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile s /tmp/systems.json \
            '{rev: $rev, generated: $date, systems: $s[0]}' > /tmp/manifest.json
          jq . /tmp/manifest.json

      - name: Upload manifest artifact
        if: steps.manifest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-manifest
          path: /tmp/manifest.json

  promote:
    name: "Move production tag → main"
    runs-on: ubuntu-latest
    # Only promote once the closure-completeness gate passes. `needs` makes this
    # job skip if verify-cache fails — hosts stay on the last good revision.
    needs: verify-cache
    # workflow_run fires regardless of conclusion; gate to success only.
    # workflow_dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Determine target SHA
        id: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.sha }}" ]; then
            SHA="${{ inputs.sha }}"
            echo "Using dispatch-input SHA: $SHA"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "Using build-all head SHA: $SHA"
          else
            SHA=$(gh api repos/${{ github.repository }}/git/refs/heads/main --jq '.object.sha')
            echo "Using current main SHA: $SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Move production tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          # PATCH the tag ref. Force-move (PATCH with force=true) so we can
          # advance even when the new SHA isn't a fast-forward descendant —
          # rare, but happens after a force-push to main or a hotfix branch.
          gh api -X PATCH \
            "repos/${{ github.repository }}/git/refs/tags/production" \
            -f sha="$SHA" \
            -F force=true
          echo "✅ production → $SHA"
          # comin hosts (my.deploy.comin) follow a production BRANCH: comin
          # tracks branches, not tags, and only ever moves to a descendant of
          # what it last deployed. Advance it alongside the tag; the tag goes
          # once every host runs comin.
          if gh api "repos/${{ github.repository }}/git/ref/heads/production" >/dev/null 2>&1; then
            gh api -X PATCH \
              "repos/${{ github.repository }}/git/refs/heads/production" \
              -f sha="$SHA" \
              -F force=true
          else
            gh api -X POST \
              "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/heads/production" \
              -f sha="$SHA"
          fi
          echo "✅ production branch → $SHA"
          {
            echo "## 🚀 Promoted to production"
            echo ""
            echo "- **SHA**: \`$SHA\`"
            echo "- **Trigger**: ${{ github.event_name }}"
            echo ""
            echo "Hosts running \`my.deploy.comin\` switch within a minute; \`my.deploy.autoUpgrade\` hosts on their next cycle (default 04:00 ±30min)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Advisory push signal: hosts running my.deploy.autoUpgrade.ntfy long-poll
      # this topic and start nixos-upgrade immediately instead of waiting for
      # the nightly timer. Best-effort by design — the timer remains the
      # catch-up path, so a missing secret, unreachable tunnel, or dropped
      # message only delays the deploy until 04:00, never blocks promotion.
      # The secret topic name is the access control (public, un-gated vhost);
      # message content is untrusted and ignored by subscribers.
      - name: Notify fleet via ntfy (best-effort)
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_DEPLOY_TOPIC }}
          # Bearer token for the authenticated ntfy server; empty while the
          # server is still open (nix/infra github-secrets.tf NTFY_CI_TOKEN).
          NTFY_TOKEN: ${{ secrets.NTFY_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_DEPLOY_TOPIC secret not set — fleet picks this up on the nightly timer."
            exit 0
          fi
          curl -fsS --max-time 15 \
            ${NTFY_TOKEN:+-H "Authorization: Bearer $NTFY_TOKEN"} \
            -H "Title: production promoted" \
            -H "Tags: rocket" \
            -d "production → ${{ steps.target.outputs.sha }}" \
            "https://ntfy.kleinbem.dev/$NTFY_TOPIC"
          echo "📣 Fleet notified via ntfy — subscribed hosts upgrade now." >> "$GITHUB_STEP_SUMMARY"

      # Publish the container manifest generated by verify-cache as a rolling
      # release asset. Devices (my.services.container-updater) fetch it at
      # 03:00 and substitute the listed paths — no on-device eval. Best-effort:
      # if the manifest step failed, the previous asset stays in place and
      # containers simply hold their current closures for one more cycle.
      - name: Download manifest artifact
        id: dl-manifest
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: container-manifest
          path: /tmp

      - name: Publish container manifest
        if: steps.dl-manifest.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh release view container-manifest --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create container-manifest --repo "${{ github.repository }}" \
              --title "Container manifest (rolling)" \
              --notes "Rolling manifest consumed by my.services.container-updater. Regenerated on every production promotion." \
              --latest=false
          gh release upload container-manifest /tmp/manifest.json --clobber --repo "${{ github.repository }}"
          echo "📦 container manifest published for $(jq -r .rev /tmp/manifest.json)" >> "$GITHUB_STEP_SUMMARY"
