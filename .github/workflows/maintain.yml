name: Maintain Flake
on:
  workflow_dispatch:
    inputs:
      inputs:
        description: "Flake inputs to update, space-separated (empty: all except kleinbem-secrets)"
        required: false
        default: ""
  # Sibling repos ask for a bump of their own input once their main is green
  # (dispatch-lock-bump.yaml in each). client_payload.inputs carries the same
  # list as the manual trigger, client_payload.sha the sibling commit.
  repository_dispatch:
    types: [lock-bump]
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC

# Dispatches arrive in bursts (several sibling merges in a row). Queue them:
# GitHub keeps only the newest pending run, so a burst collapses into one
# more run after the current one, and two runs never race on the lock branch.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # re-queue this workflow when the lock PR moved
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Commits the lock to its branch, opens and arms the PR, files the
          # validation issues. Scoped to this repo (the default).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout nix-config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nix-config
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Nix
        uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Start from the open lock PR, if any
        id: lock-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          cd nix-config
          head="$(gh pr list --head update-flake-lock --base main --state open \
            --json headRefOid --jq '.[0].headRefOid // empty')"
          if [ -n "$head" ]; then
            # A PR that changed flake.lock on main since the lock PR branched
            # off leaves it conflicting, and every commit on top of it would
            # too: start from main then, as without an open PR.
            base="$(gh api "repos/${{ github.repository }}/compare/main...$head" --jq .merge_base_commit.sha)"
            git fetch --depth 1 origin "$base"
            # The working tree is still main's.
            if ! git show "$base:flake.lock" | cmp -s - flake.lock; then
              echo "flake.lock changed on main since the lock PR at $head branched off, starting from main"
              head=""
            fi
          fi
          if [ -n "$head" ]; then
            # Extend the pending bump instead of resetting it to main: a
            # nightly nixpkgs bump still in CI would otherwise be thrown away
            # by a sibling's one-input request.
            git fetch --depth 1 origin "$head"
            git checkout "$head" -- flake.lock
            echo "starting from the open lock PR at $head"
          else
            echo "no open lock PR, starting from main"
          fi
          cp flake.lock /tmp/flake.lock.before
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Update flake inputs (requested ones, else all but kleinbem-secrets)
        env:
          # Manual run or sibling dispatch; validated against the flake below,
          # so a typo or a foreign name fails here instead of in `nix`.
          REQUESTED: ${{ github.event.inputs.inputs || github.event.client_payload.inputs }}
        run: |
          set -euo pipefail
          cd nix-config
          # kleinbem-secrets is updated by hand and private (CI has no token
          # for it, so fetching would 404). Every other input is discovered.
          all=$(nix flake metadata --json | jq -r '
            .locks.nodes.root.inputs
            | keys[]
            | select(. != "kleinbem-secrets")
          ')
          if [ -z "$all" ]; then
            echo "::error::Could not discover flake inputs — refusing to run unbounded \`nix flake update\`."
            exit 1
          fi
          if [ -n "$REQUESTED" ]; then
            inputs=""
            # shellcheck disable=SC2086 # REQUESTED is a space-separated list of inputs
            for i in $REQUESTED; do
              if grep -qx -- "$i" <<<"$all"; then
                inputs="$inputs $i"
              else
                echo "::error::'$i' is not a flake input of nix-config (have: $(tr '\n' ' ' <<<"$all"))"
                exit 1
              fi
            done
          else
            inputs=$(tr '\n' ' ' <<<"$all")
          fi
          echo "Updating inputs: $inputs"
          # shellcheck disable=SC2086 # inputs is a space-separated list of inputs
          nix flake update $inputs

      - name: Validate flake (eval-only — blocks a bad lock from landing)
        id: validate
        # Not `nix flake check --no-build`: devenv's task runner comes via IFD,
        # which --no-build refuses to realize. Evaluating every check and
        # devShell drvPath covers most of it (host-* toplevels included), but
        # not the container-factory configs or non-x86_64 devShells.
        run: |
          set -euo pipefail
          # kleinbem-secrets is private and CI has no PAT in nix access-tokens, so
          # substitute the shared dummy stub (see .github/scripts/).
          ./nix-config/.github/scripts/setup-dummy-secrets.sh
          cd nix-config
          # On a failure, evaluate once more with --show-trace into the log the
          # report step below reads (the derivation chain down to the error).
          eval_drv() {
            echo "eval $1"
            if ! nix eval "$1" --override-input kleinbem-secrets /tmp/dummy-secrets > /dev/null; then
              echo "FAILED $1" > "$RUNNER_TEMP/eval.log"
              nix eval "$1" --show-trace --override-input kleinbem-secrets /tmp/dummy-secrets \
                >> "$RUNNER_TEMP/eval.log" 2>&1 || true
              return 1
            fi
          }
          attr_names() {
            nix eval "$1" --apply builtins.attrNames --json \
              --override-input kleinbem-secrets /tmp/dummy-secrets | jq -r '.[]'
          }
          # Names go into a variable first: a failing command substitution in
          # a `for` list doesn't trip -e and would leave nothing to validate.
          for system in x86_64-linux aarch64-linux; do
            checks=$(attr_names ".#checks.$system")
            [ -n "$checks" ] || { echo "::error::no checks found for $system"; exit 1; }
            for check in $checks; do
              # host-phone (nix-on-droid) can never eval purely: upstream pins
              # its cross-compiled proot-static as a raw /nix/store string,
              # which types.package coerces via builtins.storePath — rejected
              # in pure eval (nix-on-droid requires --impure + its cachix).
              [ "$check" = "host-phone" ] && continue
              eval_drv ".#checks.$system.\"$check\".drvPath"
            done
          done
          shells=$(attr_names ".#devShells.x86_64-linux")
          [ -n "$shells" ] || { echo "::error::no devShells found"; exit 1; }
          for shell in $shells; do
            eval_drv ".#devShells.x86_64-linux.\"$shell\".drvPath"
          done

      # A stale hash only shows when the fetch is built (no Attic here, so
      # our own and unfree packages' sources are fetched each time). Only
      # where nixpkgs moves: a sibling's one-input bump only evaluates.
      - name: Choose what nix-detour builds
        id: build-mode
        # Also after a failed validation, like the nix-detour step.
        if: always()
        env:
          REQUESTED: ${{ github.event.inputs.inputs || github.event.client_payload.inputs }}
        run: |
          if [[ -z $REQUESTED || " $REQUESTED " == *" nixpkgs "* ]]; then
            echo "build=fetches" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # Report only: which packages nix-detour would hold for this update,
      # checked against kleinbem/nix-detour-fleet; the report goes into the
      # validation issue.
      - name: What nix-detour would hold
        id: holds
        if: always() && (steps.validate.outcome == 'failure' || steps.validate.outcome == 'success')
        continue-on-error: true
        uses: kleinbem-dev/nix-detour/update@81a8caac8e97e46cde970f5358aba5f128314c45 # main after v0.3.1: build: fetches, unavailable, ahead
        with:
          token: ${{ steps.app-token.outputs.token }}
          directory: nix-config
          # The holds are in nix-detour-fleet: checked through this input.
          holds-repo: kleinbem/nix-detour-fleet
          holds-input: nix-detour-fleet
          nix-args: --override-input kleinbem-secrets /tmp/dummy-secrets
          systems: x86_64-linux aarch64-linux
          build: ${{ steps.build-mode.outputs.build }}
          # Hold on the lock this run started from: the open lock PR's
          # (validated) when it continues that PR, else main's.
          base: ${{ steps.lock-pr.outputs.head || 'main' }}

      # One issue for a nightly update that fails validation: opened or
      # commented with the error (for a broken package, a ready
      # nix-detour-fleet entry), closed when an update validates again.
      # A second one for an update that validates but breaks a package's
      # build (nix-detour's report): the update still goes out.
      - name: Report validation result
        if: always() && github.ref == 'refs/heads/main' && (steps.validate.outcome == 'failure' || steps.validate.outcome == 'success')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.validate.outcome }}
          HOLDS_REPORT: ${{ steps.holds.outputs.report || '(no report, see the run)' }}
          HOLDS_OUTCOME: ${{ steps.holds.outcome }}
          HOLDS_HELD: ${{ steps.holds.outputs.held }}
          HOLDS_FAILED: ${{ steps.holds.outputs.failed }}
          HOLDS_AHEAD: ${{ steps.holds.outputs.ahead }}
          BUILD_MODE: ${{ steps.build-mode.outputs.build }}
          ISSUE_TITLE: "Lock update fails validation"
          BUILD_ISSUE_TITLE: "Lock update breaks package builds"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [[ $OUTCOME == success ]]; then
            [[ -z $issue ]] || gh issue close "$issue" --comment "Validates again: $RUN_URL"
            # Without a report (the step failed) nothing is known either way.
            [[ $HOLDS_OUTCOME == success ]] || exit 0
            issue="$(gh issue list --state open --search "in:title \"$BUILD_ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
            if [[ $HOLDS_REPORT == "Nothing fails." ]]; then
              # Only a run that built the fetches shows the builds work again.
              [[ -z $issue || $BUILD_MODE != fetches ]] || gh issue close "$issue" --comment "Nothing fails any more: $RUN_URL"
              exit 0
            fi
            # Only downloads failed (cache or network): nothing is known about
            # the builds, so the issue stays as it is.
            [[ -n $HOLDS_HELD || -n $HOLDS_FAILED || -n $HOLDS_AHEAD ]] || exit 0
            body="This lock update evaluates, but nix-detour found packages whose fetches fail with it (built on x86_64-linux only; report only, the update still goes out):

          $HOLDS_REPORT

          Run: $RUN_URL"
            if [[ -z $issue ]]; then
              gh issue create --title "$BUILD_ISSUE_TITLE" --body "$body"
            else
              # The same report as the latest one (several updates a day) adds nothing.
              latest=$(gh issue view "$issue" --json body,comments --jq '(.comments | last | .body) // .body')
              [[ $latest == *"$HOLDS_REPORT"* ]] || gh issue comment "$issue" --body "$body"
            fi
            exit 0
          fi
          body="$(./nix-config/.github/scripts/lock-failure-report.sh "$RUNNER_TEMP/eval.log" /tmp/flake.lock.before)

          What nix-detour would hold (report only):

          $HOLDS_REPORT

          Run: $RUN_URL"
          if [[ -n $issue ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi

      # Where the lock commit goes: on the open lock PR it extends, or on main.
      # Re-queues a full update instead when either moved during validation.
      - name: Choose the lock PR base
        id: pr-base
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Only for re-queueing this workflow (see below).
          DISPATCH_TOKEN: ${{ github.token }}
          BRANCH_NAME: update-flake-lock
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.lock-pr.outputs.head }}
        run: |
          cd nix-config
          if cmp -s flake.lock /tmp/flake.lock.before; then
            echo "flake.lock unchanged — nothing to commit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$BASE_SHA" ]; then
            # Validation takes minutes, and the lock PR can merge (deleting its
            # branch), close or move meanwhile. If it landed as-is, main now
            # carries the lock this run started from, so commit on top of main.
            # Anything else: re-queue a full update, which starts afresh.
            open_head="$(gh pr list --head "$BRANCH_NAME" --base main --state open \
              --json headRefOid --jq '.[0].headRefOid // empty')"
            if [ "$open_head" != "$BASE_SHA" ]; then
              main_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
              git fetch --depth 1 origin "$main_sha"
              if git show "$main_sha:flake.lock" | cmp -s - /tmp/flake.lock.before; then
                echo "the lock PR at $BASE_SHA landed during validation, committing on main"
                BASE_SHA=""
              else
                echo "::warning::the lock PR moved away from $BASE_SHA during validation, re-queueing a full update"
                GH_TOKEN="$DISPATCH_TOKEN" gh workflow run maintain.yml --ref main
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          if [ -z "$BASE_SHA" ]; then
            # This run updated the lock it checked out. If a PR changed
            # flake.lock on main since then, committing ours would revert it
            # (#285 undid #284's kleinbem-secrets bump): start afresh instead.
            main_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
            git fetch --depth 1 origin "$main_sha"
            if ! git show "$main_sha:flake.lock" | cmp -s - /tmp/flake.lock.before; then
              echo "::warning::flake.lock changed on main during validation, re-queueing a full update"
              GH_TOKEN="$DISPATCH_TOKEN" gh workflow run maintain.yml --ref main
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The branch goes onto this main, the one whose lock was checked.
            echo "reset-to=$main_sha" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      # Empty base-sha: the branch is reset to reset-to. A closed lock PR gets a
      # new one instead of a reopen.
      - name: Commit the lock and open or update its PR
        if: github.ref == 'refs/heads/main' && steps.pr-base.outputs.skip != 'true'
        uses: kleinbem/actions/lock-pr@872d4ed3eeb3da51d0bbe60e5ef3cbf6ece91e8e # v1.6.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          working-directory: nix-config
          base-sha: ${{ steps.pr-base.outputs.sha }}
          reset-to: ${{ steps.pr-base.outputs.reset-to }}
          body: Automated lockfile update. Check re-validates the new inputs on this PR; auto-merge is enabled and lands this once it's green.
