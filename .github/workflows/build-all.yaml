name: "Build & Cache All (Fast)"

# Mirror of the meta-workspace build-all workflow, building from nix-config
# directly. Runs alongside the meta version during the meta-flake →
# nix-config root migration; meta's copy will be retired once this one is
# proven green for a full cycle.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'terraform/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'terraform/**'
      - 'LICENSE'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

# Only PR runs cancel their superseded predecessor. On main, a newer push
# queues behind the running one instead (GitHub keeps just the newest pending
# run): the best-effort toplevels take hours and the lock bot
# pushes to main several times a day, so cancel-in-progress there meant the
# heavy cache-warming builds were routinely killed before finishing (e.g. run
# 37291070182, cancelled by the #98 lock push after 25 min).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-all:
    name: "Build (${{ matrix.system }})"
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine Cache Push
        id: cache
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "push_cache=false" >> "$GITHUB_OUTPUT"
          else
            echo "push_cache=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nix fleet setup
        uses: ./.github/actions/nix-fleet-setup
        with:
          # Ephemeral key only: runner peers land in ci-runners (cache-only
          # policy) and auto-expire ~10 min after the run.
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          # PR builds only read the cache, so they never get the push token
          # (no fallback to it when the pull token is missing).
          attic-token: ${{ github.event_name == 'pull_request' && secrets.ATTIC_PULL_TOKEN || github.event_name != 'pull_request' && secrets.ATTIC_PUSH_TOKEN || '' }}
          configure-auto-gc: 'true'
          free-disk-space: 'true'

      - name: Initialize Commit Statuses for best-effort builds
        if: steps.cache.outputs.push_cache == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SYSTEM="${{ matrix.system }}"
          SHA="${{ github.sha }}"
          
          # Initialize container-factory on both systems
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="pending" \
            -f context="CI/container-factory ($SYSTEM)" \
            -f description="Container factory build is pending" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            
          if [ "$SYSTEM" = "aarch64-linux" ]; then
            gh api "repos/${{ github.repository }}/statuses/$SHA" \
              -f state="pending" \
              -f context="CI/orin-nano" \
              -f description="Orin Nano toplevel build is pending" \
              -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Run nix-fast-build
        run: |
          set -o pipefail
          # Construct build arguments.
          # --eval-workers 2: cap parallel eval-jobs forks. Default = nproc,
          # which on the 7 GiB hosted runner has been OOM-killing the runner
          # before the build step produces any output (visible as the
          # "hosted runner lost communication" error). Same issue hits meta's
          # build-all; this is the conservative first-pass fix.
          # Check enumeration via `nix eval` + attrNames, NOT `nix flake show`:
          # flake show evaluates every output of every system just to list
          # names, and on the CI (Determinate) Nix it emitted `"checks": null`
          # instead of failing — with stderr discarded, CI_CHECKS was silently
          # EMPTY and this job built zero checks for months (run 29467089940
          # and earlier). Hence also the emptiness guard: an empty list is
          # always an enumeration bug, never a real state, so fail loud.
          #
          # Exclusions:
          # - VM-based NixOS tests (caddy/code-server/mobile-link/recovery) run
          #   in the dedicated vm-tests.yaml workflow; they remain in .#checks
          #   for local runs.
          # - host-* checks: hosts are targeted EXPLICITLY below (hass-pi +
          #   core-pi hardcoded native on aarch64, mac-mini + nasbook
          #   hardcoded native on x86_64 — they pull production via
          #   my.deploy.autoUpgrade with requireCache = true, same "must never
          #   build on-device" contract as the RPi5 pair; nixos-nvme builds in
          #   its own workflow (build-nvme.yaml) because its ~8.6 GiB eval
          #   needs swap + isolation and promote must not wait for it; Orin/routers
          #   deliberately never build in CI — jetpack/bespoke kernels).
          #   Enumerating them here would re-add those giant builds blocking.
          # What this restores is the real checks — pre-commit-check and the
          # flake-lock-no-file-url reproducibility guard, which must gate
          # every PR.
          SYSTEM="${{ matrix.system }}"
          mapfile -t CI_CHECKS < <(nix eval ".#checks.$SYSTEM" \
              --apply builtins.attrNames --json $NIX_OVERRIDES \
            | jq -r '.[] | select(test("(caddy|code-server|mobile-link|recovery)-test|^host-") | not)')
          if [ "${#CI_CHECKS[@]}" -eq 0 ]; then
            echo "::error::.#checks.$SYSTEM enumeration came back empty — enumeration is broken (it can never legitimately be empty)."
            exit 1
          fi
          echo "CI checks to build: ${CI_CHECKS[*]}"

          COMMON=(
            "--no-nom"
            "--skip-cached"
            "--eval-workers" "2"
            "--systems" "$SYSTEM"
            # Retry failed builds twice — the Attic push rides NetBird, so a
            # transient network/SSH hiccup retries instead of failing the target.
            "--retries" "2"
          )
          # If pushing to cache, tell nix-fast-build to use Attic directly.
          if [ "${{ steps.cache.outputs.push_cache }}" == "true" ]; then
            COMMON+=("--attic-cache" "system")
          fi

          # IMPORTANT: nix-fast-build's `--flake` is SINGLE-VALUED (argparse
          # store — the LAST one wins). Passing multiple `--flake` silently
          # builds only the last target, which is why the cache was badly
          # under-populated (only `.#devShells` ever built). So we invoke
          # nix-fast-build ONCE PER target.
          #
          # Build only what hosts actually DEPLOY: their system toplevels (native
          # arch) + devShells + non-VM checks. We deliberately do NOT build
          # `.#packages` — it exposes cross-arch install IMAGES (e.g.
          # router-1-image, an aarch64 image that gets cross-built on the x86_64
          # runner) and standalone packages that no host deploys. Everything a
          # host actually uses is already in its toplevel closure, so building
          # toplevels caches it natively without the cross-build waste.
          #
          # The bare `.#nixosConfigurations` does NOT materialize host toplevels,
          # so name them explicitly. Each host builds on its native-arch runner
          # (matrix), so no emulation. RPi5 hosts carry the custom linux-rpi
          # kernel (absent from cache.nixos.org). Excluded: routers (bespoke
          # Banana Pi R4 kernel) — add once they're confirmed to build in CI.
          TARGETS=()
          for c in "${CI_CHECKS[@]}"; do
            TARGETS+=(".#checks.$SYSTEM.$c")
          done
          # devShells are for DEVELOPMENT on the x86_64 workstation. Edge
          # (aarch64) hosts are headless and never run `nix develop`, so don't
          # waste a runner building them there.
          if [ "$SYSTEM" = "x86_64-linux" ]; then
            TARGETS+=(".#devShells")
          fi
          # Host toplevels float the siblings only on PRs: that is the early
          # warning for cross-repo breakage. On main the committed-lock step
          # below builds them exactly as a device resolves them; building the
          # floated variant there too would only double the heavy builds.
          if [ "${{ steps.cache.outputs.push_cache }}" != "true" ]; then
            if [ "$SYSTEM" = "x86_64-linux" ]; then
              TARGETS+=(
                ".#nixosConfigurations.mac-mini.config.system.build.toplevel"
                ".#nixosConfigurations.nasbook.config.system.build.toplevel"
              )
            fi
            if [ "$SYSTEM" = "aarch64-linux" ]; then
              TARGETS+=(
                ".#nixosConfigurations.hass-pi.config.system.build.toplevel"
                ".#nixosConfigurations.core-pi.config.system.build.toplevel"
              )
            fi
          fi

          rc=0
          for t in "${TARGETS[@]}"; do
            echo "::group::nix-fast-build $t"
            nix run github:Mic92/nix-fast-build -- "${COMMON[@]}" --flake "$t" $NIX_OVERRIDES || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # Pull-deploy hosts resolve `github:kleinbem/nix-config?ref=production`
      # with the COMMITTED flake.lock and the real (private) kleinbem-secrets:
      # zero overrides. Everything above floats the siblings to their main
      # and swaps in dummy secrets, so what it built is not the closure a
      # device fetches — the lock may lag a sibling, and the sops files are
      # part of `etc`, `activate` and the toplevel. Until 2026-10-20 nothing
      # in CI built that device closure: promote's cache gate verified the
      # floated one, and whenever the lock lagged the device compiled on its
      # own until RuntimeMaxSec killed it, night after night, until the lock
      # bot caught up. This step builds and pushes the exact device closure
      # and is BLOCKING: red here means a host that cannot upgrade. The App
      # token lets Nix fetch the private secrets input (same as promote's
      # lock-honesty eval); the encrypted sops files it adds to the closure
      # already sit in Attic from every local `dev::apply`. nixos-nvme and
      # orin-nano below build from the lock the same way, best-effort.
      - name: Mint GitHub App token for kleinbem-secrets
        id: app-token
        if: steps.cache.outputs.push_cache == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Scope to the secrets repo explicitly: the default is nix-config only.
          repositories: |
            kleinbem-secrets

      - name: Build pull-deploy host toplevels from the committed lock (blocking)
        if: steps.cache.outputs.push_cache == 'true'
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ steps.app-token.outputs.token }}"
        run: |
          set -o pipefail
          SYSTEM="${{ matrix.system }}"
          COMMON=(
            "--no-nom"
            "--skip-cached"
            "--eval-workers" "1"
            # mac-mini and core-pi exceed nix-eval-jobs' 4096 MiB default
            # (seen 2026-10-20: "evaluation exceeded the memory budget ...
            # even when run alone"); one worker on a 16 GB runner has room.
            "--eval-max-memory-size" "8192"
            "--systems" "$SYSTEM"
            "--retries" "2"
            "--attic-cache" "system"
          )
          # Every requireCache = true host with a native runner here. Keep in
          # sync with promote-production.yaml's "Assert no deployed host
          # would build".
          if [ "$SYSTEM" = "x86_64-linux" ]; then
            HOSTS=(mac-mini nasbook)
          else
            HOSTS=(hass-pi core-pi)
          fi
          rc=0
          for h in "${HOSTS[@]}"; do
            echo "::group::nix-fast-build (committed lock) $h"
            nix run github:Mic92/nix-fast-build -- "${COMMON[@]}" \
              --flake ".#nixosConfigurations.$h.config.system.build.toplevel" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # Flake input SOURCES aren't build outputs, so nix-fast-build never pushes
      # them; devices then download every new input revision as a tarball from
      # api.github.com, and a lock update can hit GitHub's per-IP archive limit
      # (HTTP 429, seen 2026-10-15 for NousResearch/hermes-agent on nixos-nvme
      # although its Nix token works). Locked inputs carry a narHash, and Nix
      # looks a narHash'd source up in its substituters before fetching
      # (builtins.fetchTree docs), so with the sources in Attic devices fetch
      # them from here instead. `nix flake archive` lists every input,
      # transitive ones included. Sources are system-independent: x86_64 only.
      - name: Push flake input sources to Attic (best-effort)
        if: matrix.system == 'x86_64-linux' && steps.cache.outputs.push_cache == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # NIX_OVERRIDES is a list of flags
          nix flake archive --json $NIX_OVERRIDES . \
            | jq -r '[.. | objects | .path? // empty] | unique | .[]' > "$RUNNER_TEMP/flake-sources.txt"
          echo "flake input sources: $(wc -l < "$RUNNER_TEMP/flake-sources.txt")"
          xargs -a "$RUNNER_TEMP/flake-sources.txt" attic push system

      - name: Add swap for heavy evals
        # Workstation + container-factory evals run near the hosted runner's
        # memory ceiling; spill to the SSD instead of getting SIGTERM'd.
        # Unconditional (PRs included) because the blocking factory eval below
        # runs on PRs too.
        run: |
          sudo fallocate -l 12G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h

      # Orin Nano (Jetson) toplevel: warm the cache so the workstation's
      # `just apply` / nightly autoUpgrade SUBSTITUTE the jetpack/L4T kernel
      # instead of emulating an hours-long aarch64 build under qemu locally.
      # Runs on the NATIVE ubuntu-24.04-arm runner (no emulation), same as the
      # hass-pi / core-pi toplevels above. BEST-EFFORT for the same reason as
      # nvme/factory: a jetpack/nixpkgs breakage must warn, never block
      # `Promote → production`.
      #
      # The KERNEL is built as its own target first: nix-fast-build only
      # pushes a target's closure to Attic when that whole target succeeds,
      # so a red toplevel alone caches nothing — not even the ~30 min kernel
      # it did build successfully. As a separate target it's cached whenever
      # it builds, independent of the rest of the toplevel.
      #
      # On failure, the root-cause build logs are printed explicitly:
      # nix-fast-build keeps only the last 10k log lines, and the kernel build
      # alone overflows that, so the derivation that actually broke (built
      # early, failed early) scrolls out and only "N dependencies failed" for
      # the toplevel survives. .github/scripts/report-failed-drvs.sh (shared
      # with the nvme and factory steps) finds every attempted-but-failed
      # derivation and prints its failure lines + log tail.
      - name: Build orin-nano toplevel (best-effort)
        id: orin-build
        if: matrix.system == 'aarch64-linux' && steps.cache.outputs.push_cache == 'true'
        continue-on-error: true
        env:
          # Committed lock + real secrets, like the blocking step above.
          NIX_CONFIG: "access-tokens = github.com=${{ steps.app-token.outputs.token }}"
        run: |
          set -o pipefail
          COMMON=(
            "--no-nom"
            "--skip-cached"
            "--eval-workers" "1"
            "--eval-max-memory-size" "8192"
            "--systems" "${{ matrix.system }}"
            "--retries" "2"
            "--attic-cache" "system"
          )
          HOST=".#nixosConfigurations.orin-nano.config"
          MARK=$(mktemp) # failure report scopes to logs written after this
          rc=0
          nix run github:Mic92/nix-fast-build -- "${COMMON[@]}" \
            --flake "$HOST.system.build.kernel" || rc=1
          nix run github:Mic92/nix-fast-build -- "${COMMON[@]}" \
            --flake "$HOST.system.build.toplevel" || rc=1
          [ "$rc" -eq 0 ] && exit 0
          .github/scripts/report-failed-drvs.sh orin-nano "$MARK"
          exit 1

      # Container factory eval is BLOCKING (and runs on PRs, unlike the build
      # below): if the factory toplevel doesn't evaluate, nix-fast-build reports
      # "0 successes", NOTHING is built or pushed, and the container manifest
      # can never converge — new/changed container closures silently drop out
      # of it cycle after cycle. That exact failure hid inside the best-effort
      # build step for a day (nix-presets 61352e5 hardcoded a sops path the
      # factory can't eval; core-pi's monitoring container couldn't stage).
      # Eval breakage is a code bug that must fail CI loudly at PR time;
      # build/push flakiness (the reason the BUILD is best-effort) is not.
      - name: Eval container-factory toplevel (blocking)
        id: factory-eval
        run: |
          set -o pipefail
          FACTORY="container-factory"
          if [ "${{ matrix.system }}" = "aarch64-linux" ]; then
            FACTORY="container-factory-aarch64"
          fi
          echo "FACTORY=$FACTORY" >> "$GITHUB_ENV"
          nix eval --raw \
            ".#nixosConfigurations.$FACTORY.config.system.build.toplevel.drvPath" \
            $NIX_OVERRIDES

      # Turn a red factory eval into a phone notification instead of a red run
      # someone has to go diagnose. The most common cause is a nixpkgs bump
      # moving an insecure-marked package (openclaw) past its pinned re-ack in
      # nix-presets lib/factory.nix — a deliberate checkpoint, fixed by bumping
      # one version string there. Best-effort: no secret / unreachable ntfy
      # never affects the job result. NTFY_ALERT_TOPIC is separate from
      # NTFY_DEPLOY_TOPIC on purpose — the deploy topic is machine-consumed
      # (any message triggers host upgrade polls); this one is for humans.
      - name: Alert factory eval failure via ntfy (best-effort)
        if: failure() && steps.factory-eval.outcome == 'failure'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_ALERT_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_ALERT_TOPIC secret not set — skipping alert."
            exit 0
          fi
          curl -fsS --max-time 15 \
            ${NTFY_TOKEN:+-H "Authorization: Bearer $NTFY_TOKEN"} \
            -H "Title: container-factory eval failed (${{ matrix.system }})" \
            -H "Tags: rotating_light" \
            -H "Priority: high" \
            -d "Blocking factory eval is red on ${{ matrix.system }}. Likely an insecure re-ack (openclaw version bump → update the pin in nix-presets lib/factory.nix) or a preset regression. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.kleinbem.dev/$NTFY_TOPIC"

      # Container factory: materializes every standalone container closure for
      # this arch (they are NOT part of any host closure anymore — standalone
      # containers boot from a profile symlink, so nothing else would ever push
      # them to Attic). The promote workflow evals the same factories to
      # publish the container manifest devices consume.
      # BEST-EFFORT: a red factory BUILD must not block host promotion; the
      # manifest gate in promote-production refuses to publish a manifest whose
      # paths aren't fully cached, so a failed factory build just means
      # "manifest stays at the previous rev" — devices keep serving the old
      # closures. Eval correctness is enforced by the blocking step above.
      #
      # Built PER CONTAINER (`.config.containers.<name>.path`, same attribute
      # promote-production's manifest step already uses), not the combined
      # `.config.system.build.toplevel`. The toplevel bundles every
      # container's etc/system-units/activate into one derivation graph, so
      # one container failing to build from source (e.g. a from-source
      # package regression — this is what actually happened: qdrant 1.18.2
      # failing to build took code-server/netdata/buzz/syncthing down with it,
      # nothing repushed for ANY of them for days) previously failed the
      # WHOLE build. Looping isolates that: a broken container only drops
      # itself from this cycle's cache refresh, same as it already silently
      # drops itself from the manifest when its OWN closure isn't cached.
      - name: Build container-factory toplevel (best-effort)
        id: factory-build
        if: steps.cache.outputs.push_cache == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          COMMON=(
            "--no-nom"
            "--skip-cached"
            "--eval-workers" "1"
            "--systems" "${{ matrix.system }}"
            "--retries" "2"
            "--attic-cache" "system"
          )
          # $FACTORY is exported by the blocking eval step above.
          mapfile -t CONTAINERS < <(nix eval \
              ".#nixosConfigurations.$FACTORY.config.containers" \
              --apply builtins.attrNames --json $NIX_OVERRIDES \
            | jq -r '.[]')
          if [ "${#CONTAINERS[@]}" -eq 0 ]; then
            echo "::error::$FACTORY.config.containers enumeration came back empty — enumeration is broken (it can never legitimately be empty)."
            exit 1
          fi
          echo "Containers to build: ${CONTAINERS[*]}"

          MARK=$(mktemp) # failure report scopes to logs written after this
          failed=()
          for c in "${CONTAINERS[@]}"; do
            echo "::group::nix-fast-build container: $c"
            nix run github:Mic92/nix-fast-build -- "${COMMON[@]}" \
              --flake ".#nixosConfigurations.$FACTORY.config.containers.\"$c\".path" $NIX_OVERRIDES \
              || failed+=("$c")
            echo "::endgroup::"
          done
          [ "${#failed[@]}" -eq 0 ] && exit 0
          .github/scripts/report-failed-drvs.sh "$FACTORY (${failed[*]})" "$MARK"
          exit 1

      # The builds above are continue-on-error so a from-source break (a
      # nixpkgs test regression, a sops manifest drift) never blocks promotion.
      # But that also means such a break is INVISIBLE — the run stays green while
      # the cache silently goes cold and hosts fall back to compiling locally.
      # This step turns a red best-effort build into a phone alert instead: it
      # reads the steps' `outcome` (which records the real failure even though
      # continue-on-error sets `conclusion` to success) and pings the human topic.
      # Itself best-effort — a missing/unreachable ntfy never affects the result.
      - name: Alert best-effort toplevel build failure via ntfy
        if: always() && (steps.factory-build.outcome == 'failure' || steps.orin-build.outcome == 'failure')
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_ALERT_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_ALERT_TOPIC secret not set — skipping alert."
            exit 0
          fi
          failed=""
          [ "${{ steps.factory-build.outcome }}" = "failure" ] && failed="container-factory"
          [ "${{ steps.orin-build.outcome }}" = "failure" ] && failed="${failed:+$failed, }orin-nano"
          curl -fsS --max-time 15 \
            ${NTFY_TOKEN:+-H "Authorization: Bearer $NTFY_TOKEN"} \
            -H "Title: best-effort toplevel build failed (${{ matrix.system }})" \
            -H "Tags: warning" \
            -H "Priority: default" \
            -d "Run stayed green but these toplevels failed to build from source on ${{ matrix.system }}: $failed. Cache is not being warmed for them — hosts will compile locally until fixed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.kleinbem.dev/$NTFY_TOPIC"

      - name: Report Best-Effort Failures to GitHub Summary
        if: always() && (steps.factory-build.outcome == 'failure' || steps.orin-build.outcome == 'failure')
        continue-on-error: true
        run: |
          echo "## ⚠️ Best-Effort Builds Failed" >> $GITHUB_STEP_SUMMARY
          echo "The overall CI run is green so that fleet promotion isn't blocked, but some heavy from-source builds failed. These packages were **not pushed to the cache** and your hosts will build them locally:" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.factory-build.outcome }}" = "failure" ] && echo "- \`container-factory\`" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.orin-build.outcome }}" = "failure" ] && echo "- \`orin-nano\` toplevel" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The failing derivations are listed per step above; their logs are in the matching \`FAILED <drv>\` groups of the step output." >> $GITHUB_STEP_SUMMARY

      - name: Update Commit Statuses for best-effort builds
        if: always() && steps.cache.outputs.push_cache == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SYSTEM="${{ matrix.system }}"
          SHA="${{ github.sha }}"
          
          update_status() {
            local context="$1"
            local outcome="$2"
            local desc_prefix="$3"
            local state desc
            # Only an actual `success` outcome is success — a cancelled run
            # used to fall through to the success default and mark builds that
            # never ran as green.
            case "$outcome" in
              success) state="success"; desc="${desc_prefix} succeeded" ;;
              failure) state="failure"; desc="${desc_prefix} failed" ;;
              cancelled) state="error"; desc="${desc_prefix} was cancelled" ;;
              *) state="error"; desc="${desc_prefix} was skipped or errored" ;;
            esac
            
            gh api "repos/${{ github.repository }}/statuses/$SHA" \
              -f state="$state" \
              -f context="CI/$context" \
              -f description="$desc" \
              -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          # Update container-factory status
          update_status "container-factory ($SYSTEM)" "${{ steps.factory-build.outcome }}" "Container factory build"

          if [ "$SYSTEM" = "aarch64-linux" ]; then
            update_status "orin-nano" "${{ steps.orin-build.outcome }}" "Orin Nano toplevel build"
          fi
