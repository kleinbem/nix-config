name: "Build & Cache All (Fast)"

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'terraform/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'terraform/**'
      - 'LICENSE'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

# Only PR runs cancel their predecessor. On main a newer push queues instead:
# the cache-warming builds take hours and the lock bot pushes several times a
# day, so cancelling there would kill them before they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-all:
    name: "Build (${{ matrix.system }})"
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine Cache Push
        id: cache
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "push_cache=false" >> "$GITHUB_OUTPUT"
          else
            echo "push_cache=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nix fleet setup
        uses: ./.github/actions/nix-fleet-setup
        with:
          # Ephemeral key only: runner peers land in ci-runners (cache-only
          # policy) and auto-expire ~10 min after the run.
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          # PR builds only read the cache, so they never get the push token
          # (no fallback to it when the pull token is missing).
          attic-token: ${{ github.event_name == 'pull_request' && secrets.ATTIC_PULL_TOKEN || github.event_name != 'pull_request' && secrets.ATTIC_PUSH_TOKEN || '' }}
          configure-auto-gc: 'true'
          free-disk-space: 'true'

      - name: Initialize Commit Statuses for best-effort builds
        if: steps.cache.outputs.push_cache == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SYSTEM="${{ matrix.system }}"
          SHA="${{ github.sha }}"
          
          # Initialize container-factory on both systems
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="pending" \
            -f context="CI/container-factory ($SYSTEM)" \
            -f description="Container factory build is pending" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            
          if [ "$SYSTEM" = "aarch64-linux" ]; then
            gh api "repos/${{ github.repository }}/statuses/$SHA" \
              -f state="pending" \
              -f context="CI/orin-nano" \
              -f description="Orin Nano toplevel build is pending" \
              -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Run nix-fast-build
        run: |
          set -o pipefail
          # --eval-workers 2: the nproc default OOM-kills the 7 GiB hosted
          # runner ("hosted runner lost communication").
          # Checks are listed via `nix eval` + attrNames, not `nix flake show`,
          # which on Determinate Nix printed `"checks": null` and silently
          # built nothing. An empty list is always an enumeration bug.
          # no-link: not reported upstream; `nix eval` is the sturdier way anyway.
          # Excluded: VM tests (vm-tests.yaml runs them) and host-* checks
          # (hosts are targeted explicitly below; nixos-nvme has build-nvme.yaml).
          SYSTEM="${{ matrix.system }}"
          mapfile -t CI_CHECKS < <(nix eval ".#checks.$SYSTEM" \
              --apply builtins.attrNames --json $NIX_OVERRIDES \
            | jq -r '.[] | select(test("(caddy|code-server|mobile-link|recovery)-test|^host-") | not)')
          if [ "${#CI_CHECKS[@]}" -eq 0 ]; then
            echo "::error::.#checks.$SYSTEM enumeration came back empty — enumeration is broken (it can never legitimately be empty)."
            exit 1
          fi
          echo "CI checks to build: ${CI_CHECKS[*]}"

          COMMON=(
            "--no-nom"
            "--skip-cached"
            "--eval-workers" "2"
            "--systems" "$SYSTEM"
            # Retry failed builds twice — the Attic push rides NetBird, so a
            # transient network/SSH hiccup retries instead of failing the target.
            "--retries" "2"
          )
          # If pushing to cache, tell nix-fast-build to use Attic directly.
          if [ "${{ steps.cache.outputs.push_cache }}" == "true" ]; then
            COMMON+=("--attic-cache" "system")
          fi

          # nix-fast-build's `--flake` is single-valued (the last one wins), so
          # it runs once per target. `.#packages` is skipped: it holds
          # cross-arch install images; what hosts use is in their toplevels.
          # Toplevels are named explicitly because bare `.#nixosConfigurations`
          # doesn't build them.
          TARGETS=()
          for c in "${CI_CHECKS[@]}"; do
            TARGETS+=(".#checks.$SYSTEM.$c")
          done
          # devShells are for DEVELOPMENT on the x86_64 workstation. Edge
          # (aarch64) hosts are headless and never run `nix develop`, so don't
          # waste a runner building them there.
          if [ "$SYSTEM" = "x86_64-linux" ]; then
            TARGETS+=(".#devShells")
          fi
          # Host toplevels float the siblings only on PRs: that is the early
          # warning for cross-repo breakage. On main the committed-lock step
          # below builds them exactly as a device resolves them; building the
          # floated variant there too would only double the heavy builds.
          if [ "${{ steps.cache.outputs.push_cache }}" != "true" ]; then
            if [ "$SYSTEM" = "x86_64-linux" ]; then
              TARGETS+=(
                ".#nixosConfigurations.mac-mini.config.system.build.toplevel"
                ".#nixosConfigurations.nasbook.config.system.build.toplevel"
              )
            fi
            if [ "$SYSTEM" = "aarch64-linux" ]; then
              TARGETS+=(
                ".#nixosConfigurations.hass-pi.config.system.build.toplevel"
                ".#nixosConfigurations.core-pi.config.system.build.toplevel"
              )
            fi
          fi

          rc=0
          for t in "${TARGETS[@]}"; do
            echo "::group::nix-fast-build $t"
            nix run github:Mic92/nix-fast-build -- "${COMMON[@]}" --flake "$t" $NIX_OVERRIDES || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # Pull-deploy hosts build from the committed flake.lock and the real
      # kleinbem-secrets, with no overrides. The steps above float siblings and
      # use dummy secrets, so they don't build the closure a device fetches.
      # This one does, and it blocks: red means a host that cannot upgrade.
      # The App token lets Nix fetch the private secrets input.
      - name: Mint GitHub App token for kleinbem-secrets
        id: app-token
        if: steps.cache.outputs.push_cache == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Scope to the secrets repo explicitly: the default is nix-config only.
          repositories: |
            kleinbem-secrets

      - name: Build pull-deploy host toplevels from the committed lock (blocking)
        if: steps.cache.outputs.push_cache == 'true'
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ steps.app-token.outputs.token }}"
        run: |
          set -o pipefail
          SYSTEM="${{ matrix.system }}"
          COMMON=(
            "--no-nom"
            "--skip-cached"
            "--eval-workers" "1"
            # mac-mini and core-pi exceed nix-eval-jobs' 4096 MiB default;
            # one worker on a 16 GB runner has room.
            "--eval-max-memory-size" "8192"
            "--systems" "$SYSTEM"
            "--retries" "2"
            "--attic-cache" "system"
          )
          # Every requireCache = true host with a native runner here. Keep in
          # sync with promote-production.yaml's "Assert no deployed host
          # would build".
          if [ "$SYSTEM" = "x86_64-linux" ]; then
            HOSTS=(mac-mini nasbook)
          else
            HOSTS=(hass-pi core-pi)
          fi
          rc=0
          for h in "${HOSTS[@]}"; do
            echo "::group::nix-fast-build (committed lock) $h"
            nix run github:Mic92/nix-fast-build -- "${COMMON[@]}" \
              --flake ".#nixosConfigurations.$h.config.system.build.toplevel" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # Flake input sources aren't build outputs, so nix-fast-build never pushes
      # them, and devices fetching tarballs from GitHub hit its per-IP limit
      # (HTTP 429). Nix looks narHash'd sources up in substituters first, so
      # with them in Attic devices fetch from there. System-independent: x86_64 only.
      # Archived with NIX_OVERRIDES, so kleinbem siblings are pushed at their
      # main heads, not the committed lock's revs that devices fetch.
      - name: Push flake input sources to Attic (best-effort)
        if: matrix.system == 'x86_64-linux' && steps.cache.outputs.push_cache == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # NIX_OVERRIDES is a list of flags
          nix flake archive --json $NIX_OVERRIDES . \
            | jq -r '[.. | objects | .path? // empty] | unique | .[]' > "$RUNNER_TEMP/flake-sources.txt"
          echo "flake input sources: $(wc -l < "$RUNNER_TEMP/flake-sources.txt")"
          xargs -a "$RUNNER_TEMP/flake-sources.txt" attic push system

      - name: Add swap for heavy evals
        # Workstation + container-factory evals run near the hosted runner's
        # memory ceiling; spill to the SSD instead of getting SIGTERM'd.
        # Unconditional (PRs included) because the blocking factory eval below
        # runs on PRs too.
        run: |
          sudo fallocate -l 12G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h

      # Orin Nano toplevel: warms the cache so hosts substitute the jetpack
      # kernel instead of building it. Best-effort: a jetpack/nixpkgs break
      # must warn, never block promotion. The kernel is its own target because
      # nix-fast-build only pushes a target that fully succeeds.
      # report-failed-drvs.sh prints the root cause on failure.
      - name: Build orin-nano toplevel (best-effort)
        id: orin-build
        if: matrix.system == 'aarch64-linux' && steps.cache.outputs.push_cache == 'true'
        continue-on-error: true
        env:
          # Committed lock + real secrets, like the blocking step above.
          NIX_CONFIG: "access-tokens = github.com=${{ steps.app-token.outputs.token }}"
        run: |
          set -o pipefail
          COMMON=(
            "--no-nom"
            "--skip-cached"
            "--eval-workers" "1"
            "--eval-max-memory-size" "8192"
            "--systems" "${{ matrix.system }}"
            "--retries" "2"
            "--attic-cache" "system"
          )
          HOST=".#nixosConfigurations.orin-nano.config"
          MARK=$(mktemp) # failure report scopes to logs written after this
          rc=0
          nix run github:Mic92/nix-fast-build -- "${COMMON[@]}" \
            --flake "$HOST.system.build.kernel" || rc=1
          nix run github:Mic92/nix-fast-build -- "${COMMON[@]}" \
            --flake "$HOST.system.build.toplevel" || rc=1
          [ "$rc" -eq 0 ] && exit 0
          .github/scripts/report-failed-drvs.sh orin-nano "$MARK" system
          exit 1

      # Factory eval blocks (and runs on PRs): if it doesn't evaluate, nothing
      # is built and changed containers silently drop out of the manifest.
      # Eval breakage is a code bug; build flakiness, why the build below is
      # best-effort, is not.
      - name: Eval container-factory toplevel (blocking)
        id: factory-eval
        run: |
          set -o pipefail
          FACTORY="container-factory"
          if [ "${{ matrix.system }}" = "aarch64-linux" ]; then
            FACTORY="container-factory-aarch64"
          fi
          echo "FACTORY=$FACTORY" >> "$GITHUB_ENV"
          nix eval --raw \
            ".#nixosConfigurations.$FACTORY.config.system.build.toplevel.drvPath" \
            $NIX_OVERRIDES

      # Phone alert for a red factory eval. NTFY_ALERT_TOPIC is for humans;
      # NTFY_DEPLOY_TOPIC is machine-consumed (any message triggers upgrade polls).
      - name: Alert factory eval failure via ntfy (best-effort)
        if: failure() && steps.factory-eval.outcome == 'failure'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_ALERT_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_ALERT_TOPIC secret not set — skipping alert."
            exit 0
          fi
          curl -fsS --max-time 15 \
            ${NTFY_TOKEN:+-H "Authorization: Bearer $NTFY_TOKEN"} \
            -H "Title: container-factory eval failed (${{ matrix.system }})" \
            -H "Tags: rotating_light" \
            -H "Priority: high" \
            -d "Blocking factory eval is red on ${{ matrix.system }}. Likely an insecure re-ack (openclaw version bump → update the pin in nix-presets lib/factory.nix) or a preset regression. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.kleinbem.dev/$NTFY_TOPIC"

      # Builds every standalone container closure for this arch; nothing else
      # pushes them, as they aren't in any host closure. Best-effort: promote
      # only publishes a fully cached manifest, so a failure keeps the old one.
      # Built per container (`.config.containers.<name>.path`), not via the
      # toplevel, so one broken container doesn't block the rest.
      - name: Build container-factory toplevel (best-effort)
        id: factory-build
        if: steps.cache.outputs.push_cache == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          COMMON=(
            "--no-nom"
            "--skip-cached"
            "--eval-workers" "1"
            "--systems" "${{ matrix.system }}"
            "--retries" "2"
            "--attic-cache" "system"
          )
          # $FACTORY is exported by the blocking eval step above.
          mapfile -t CONTAINERS < <(nix eval \
              ".#nixosConfigurations.$FACTORY.config.containers" \
              --apply builtins.attrNames --json $NIX_OVERRIDES \
            | jq -r '.[]')
          if [ "${#CONTAINERS[@]}" -eq 0 ]; then
            echo "::error::$FACTORY.config.containers enumeration came back empty — enumeration is broken (it can never legitimately be empty)."
            exit 1
          fi
          echo "Containers to build: ${CONTAINERS[*]}"

          MARK=$(mktemp) # failure report scopes to logs written after this
          failed=()
          for c in "${CONTAINERS[@]}"; do
            echo "::group::nix-fast-build container: $c"
            nix run github:Mic92/nix-fast-build -- "${COMMON[@]}" \
              --flake ".#nixosConfigurations.$FACTORY.config.containers.\"$c\".path" $NIX_OVERRIDES \
              || failed+=("$c")
            echo "::endgroup::"
          done
          [ "${#failed[@]}" -eq 0 ] && exit 0
          .github/scripts/report-failed-drvs.sh "$FACTORY (${failed[*]})" "$MARK" system
          exit 1

      # continue-on-error keeps the run green while the cache goes cold, so a
      # red best-effort build becomes a phone alert. `outcome` records the real
      # failure; continue-on-error only sets `conclusion` to success.
      - name: Alert best-effort toplevel build failure via ntfy
        if: always() && (steps.factory-build.outcome == 'failure' || steps.orin-build.outcome == 'failure')
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_ALERT_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_CI_TOKEN }}
          FACTORY_CAUSE: ${{ steps.factory-build.outputs.cause }}
          ORIN_CAUSE: ${{ steps.orin-build.outputs.cause }}
        run: |
          set -euo pipefail
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_ALERT_TOPIC secret not set — skipping alert."
            exit 0
          fi
          failed=""
          [ "${{ steps.factory-build.outcome }}" = "failure" ] && failed="container-factory (${FACTORY_CAUSE:-see the run})"
          [ "${{ steps.orin-build.outcome }}" = "failure" ] && failed="${failed:+$failed, }orin-nano (${ORIN_CAUSE:-see the run})"
          curl -fsS --max-time 15 \
            ${NTFY_TOKEN:+-H "Authorization: Bearer $NTFY_TOKEN"} \
            -H "Title: best-effort toplevel build failed (${{ matrix.system }})" \
            -H "Tags: warning" \
            -H "Priority: default" \
            -d "Run stayed green but these toplevels failed to build from source on ${{ matrix.system }}: $failed. What did build was pushed to Attic; the rest compiles locally until fixed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.kleinbem.dev/$NTFY_TOPIC"

      - name: Report Best-Effort Failures to GitHub Summary
        if: always() && (steps.factory-build.outcome == 'failure' || steps.orin-build.outcome == 'failure')
        continue-on-error: true
        run: |
          echo "## ⚠️ Best-Effort Builds Failed" >> $GITHUB_STEP_SUMMARY
          echo "The overall CI run is green so that fleet promotion isn't blocked, but some heavy from-source builds failed. What did build was pushed to the cache; the failed derivations and everything above them will be built locally:" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.factory-build.outcome }}" = "failure" ] && echo "- \`container-factory\`" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.orin-build.outcome }}" = "failure" ] && echo "- \`orin-nano\` toplevel" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The failing derivations are listed per step above; their logs are in the matching \`FAILED <drv>\` groups of the step output." >> $GITHUB_STEP_SUMMARY

      - name: Update Commit Statuses for best-effort builds
        if: always() && steps.cache.outputs.push_cache == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SYSTEM="${{ matrix.system }}"
          SHA="${{ github.sha }}"
          
          update_status() {
            local context="$1"
            local outcome="$2"
            local desc_prefix="$3"
            local state desc
            # Only an actual `success` outcome is success, so a cancelled or
            # skipped build never shows green.
            case "$outcome" in
              success) state="success"; desc="${desc_prefix} succeeded" ;;
              failure) state="failure"; desc="${desc_prefix} failed" ;;
              cancelled) state="error"; desc="${desc_prefix} was cancelled" ;;
              *) state="error"; desc="${desc_prefix} was skipped or errored" ;;
            esac
            
            gh api "repos/${{ github.repository }}/statuses/$SHA" \
              -f state="$state" \
              -f context="CI/$context" \
              -f description="$desc" \
              -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          # Update container-factory status
          update_status "container-factory ($SYSTEM)" "${{ steps.factory-build.outcome }}" "Container factory build"

          if [ "$SYSTEM" = "aarch64-linux" ]; then
            update_status "orin-nano" "${{ steps.orin-build.outcome }}" "Orin Nano toplevel build"
          fi
