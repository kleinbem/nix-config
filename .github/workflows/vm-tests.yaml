name: "VM Tests (KVM)"

# NixOS VM integration tests on GitHub-hosted ubuntu-latest, which DOES expose
# /dev/kvm (verified 2026-06-24 — ARM runners don't). The Determinate installer
# in nix-setup opens it up for the nix daemon (its kvm input). One test per runner
# (matrix) for parallelism. The test set is the same one build-all.yaml
# excludes from its non-VM build.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/**'
      - 'modules/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/vm-tests.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-test:
    name: "VM: ${{ matrix.test }}"
    strategy:
      fail-fast: false
      matrix:
        test:
          - caddy-test
          - code-server-test
          - mobile-link-test
          - recovery-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/nix-fleet-setup
        with:
          # Ephemeral key only: runner peers land in ci-runners (cache-only
          # policy) and auto-expire after the run.
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          # VM tests only read the cache.
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}
          free-disk-space: 'true'
          configure-auto-gc: 'true'

      - name: "Run VM test: ${{ matrix.test }}"
        run: |
          set -o pipefail
          nix build --no-link --print-build-logs \
            $NIX_OVERRIDES \
            ".#checks.x86_64-linux.${{ matrix.test }}"
