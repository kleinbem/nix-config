name: Sync reference docs
# Keeps docs/SYSTEM_REFERENCE.md, OPTIONS.md, IMPORTS.md and
# INFRASTRUCTURE.yaml in step with the code (replaces the local regeneration
# at the end of `just dev::apply`, which left every checkout dirty).
# - On a PR: regenerates from the PR head and commits any change onto the PR
#   branch (GitHub-signed), so the PR lands with current docs. A separate
#   docs PR per merge put every other open PR BEHIND main, and GitHub's own
#   "update branch" leaves commits unsigned (blocked by the ruleset).
# - On main: fallback for direct pushes, or a merge that beat the PR run;
#   lands the change as a signed PR with auto-merge.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: sync-docs-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  sync:
    # Same-repo PRs only: the app token must not push to fork branches.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The generators read the workspace layout: nix-config next to
      # kleinbem (repos.nix) and nix-presets. Nothing else is needed (checked
      # 2026-10-17: same output as with every sibling present).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: nix-config
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kleinbem/kleinbem
          path: kleinbem
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kleinbem/nix-presets
          path: nix-presets

      - name: Set up Nix
        uses: kleinbem/actions/nix-setup@d640cb482c1083235491da5ce469468a0019fc64 # v1.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Regenerate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NIX_OVERRIDES: --override-input kleinbem-secrets /tmp/dummy-secrets
        run: |
          cd nix-config
          ./.github/scripts/setup-dummy-secrets.sh
          ./scripts/sync-agent-context.sh

      - name: Commit the changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT: ${{ github.event_name }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          cd nix-config
          files=(docs/SYSTEM_REFERENCE.md docs/OPTIONS.md docs/IMPORTS.md docs/INFRASTRUCTURE.yaml)
          if git diff --quiet -- "${files[@]}"; then
            echo "Docs unchanged."
            exit 0
          fi
          git diff --stat -- "${files[@]}"

          REPO="${{ github.repository }}"
          if [ "$EVENT" = pull_request ]; then
            BRANCH="$PR_BRANCH"
            HEAD="$PR_HEAD"
          else
            BRANCH=auto/sync-docs
            HEAD=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
            if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$HEAD" -F force=true >/dev/null
            else
              gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$HEAD" >/dev/null
            fi
          fi

          # createCommitOnBranch: GitHub signs the commit (required_signatures).
          # expectedHeadOid makes it fail instead of clobbering a newer push.
          additions=$(for f in "${files[@]}"; do
            git diff --quiet -- "$f" || jq -n --arg p "$f" --arg c "$(base64 -w0 "$f")" '{path: $p, contents: $c}'
          done | jq -s .)
          jq -n --arg repo "$REPO" --arg branch "$BRANCH" --arg sha "$HEAD" --argjson add "$additions" \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: "docs: sync generated reference docs (auto)"},
                expectedHeadOid: $sha,
                fileChanges: {additions: $add}
            }}}' | gh api graphql --input - >/dev/null

          if [ "$EVENT" != pull_request ]; then
            gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN ||
              gh pr create --head "$BRANCH" --base main \
                --title "docs: sync generated reference docs" \
                --body "Regenerated by .github/workflows/sync-docs.yaml from the current main. Auto-merge lands it once checks pass."
            gh pr merge "$BRANCH" --auto --squash || true
          fi
