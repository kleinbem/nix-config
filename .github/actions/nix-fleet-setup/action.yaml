name: 'Nix fleet setup'
description: 'nix-config CI preamble: dummy secrets and sub-flake overrides, then the shared kleinbem/actions nix-setup (Determinate Nix, optional NetBird + Attic).'

# The generic part (free disk, Nix, auto-gc, NetBird, Attic) lives in
# kleinbem/actions/nix-setup, shared with the other nix repos. Only the two
# steps that are about this flake stay here.
inputs:
  netbird-setup-key:
    description: 'NetBird setup key. With attic-token, the job joins the mesh to reach the Attic cache.'
    required: false
    default: ''
  attic-token:
    description: 'Attic token: ATTIC_PULL_TOKEN for jobs that only read (PR builds, VM tests), ATTIC_PUSH_TOKEN for jobs that push. Whether a job pushes is decided by the workflow.'
    required: false
    default: ''
  configure-auto-gc:
    description: 'Configure Nix auto-gc (min-free / max-free) — recommended for big closure builds, skip for small jobs.'
    required: false
    default: 'false'
  free-disk-space:
    description: 'Reclaim ~20 GiB by deleting preinstalled toolchains. Set true for big-closure jobs (NixOS System); leave false for containers/devshells/packages — saves ~30s of overhead per job.'
    required: false
    default: 'false'
  sibling-revs:
    description: 'Sibling revs to pin NIX_OVERRIDES to ("repo=sha ..."). Empty resolves each sibling main now. Promote passes the revs build-all used.'
    required: false
    default: ''

outputs:
  sibling-revs:
    description: 'The "repo=sha ..." revs NIX_OVERRIDES is pinned to.'
    value: ${{ steps.overrides.outputs.revs }}

runs:
  using: 'composite'
  steps:
    - name: Set up dummy secrets
      shell: bash
      run: ./.github/scripts/setup-dummy-secrets.sh

    - name: Set Nix input overrides
      id: overrides
      shell: bash
      env:
        SIBLING_REVS: ${{ inputs.sibling-revs }}
      run: | # zizmor: ignore[github-env] canonical keeps only five validated 40-hex SHAs
        # Checks, container builds and PR host builds evaluate against each
        # sibling's main branch, as an early warning for cross-repo breakage.
        # Host toplevels on main and promote's cache gate don't use these:
        # devices resolve the committed lock with no overrides, so those do too.
        set -euo pipefail
        revs=$(./.github/scripts/sibling-overrides.sh canonical \
          "${SIBLING_REVS:-$(./.github/scripts/sibling-overrides.sh resolve)}")
        echo "NIX_OVERRIDES=$(./.github/scripts/sibling-overrides.sh flags "$revs")" >> "$GITHUB_ENV"
        echo "revs=$revs" >> "$GITHUB_OUTPUT"
        echo "Sibling revs: $revs"

    - name: Nix setup
      uses: kleinbem/actions/nix-setup@f1b4f5fc52ea31b1f9e53ca29170570fe4651c7d # v1.7.1
      with:
        netbird-setup-key: ${{ inputs.netbird-setup-key }}
        attic-token: ${{ inputs.attic-token }}
        configure-auto-gc: ${{ inputs.configure-auto-gc }}
        free-disk-space: ${{ inputs.free-disk-space }}
        extra-conf: |
          sandbox = relaxed
          auto-allocate-uids = true
          extra-system-features = uid-range
          experimental-features = nix-command flakes auto-allocate-uids cgroups
        # nix-config's own copy stays authoritative for this repo; the
        # action ships the same root for repos that have none.
        ca-cert: pki/caddy-root.crt
