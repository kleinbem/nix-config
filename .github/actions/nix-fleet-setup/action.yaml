name: 'Nix fleet setup'
description: 'nix-config CI preamble: dummy secrets and sub-flake overrides, then the shared kleinbem/actions nix-setup (Determinate Nix, optional NetBird + Attic).'

# The generic part (free disk, Nix, auto-gc, NetBird, Attic) lives in
# kleinbem/actions/nix-setup, shared with the other nix repos. Only the two
# steps that are about this flake stay here.
inputs:
  netbird-setup-key:
    description: 'NetBird setup key. With attic-token, the job joins the mesh to reach the Attic cache.'
    required: false
    default: ''
  attic-token:
    description: 'Attic token: ATTIC_PULL_TOKEN for jobs that only read (PR builds, VM tests), ATTIC_PUSH_TOKEN for jobs that push. Whether a job pushes is decided by the workflow.'
    required: false
    default: ''
  configure-auto-gc:
    description: 'Configure Nix auto-gc (min-free / max-free) — recommended for big closure builds, skip for small jobs.'
    required: false
    default: 'false'
  free-disk-space:
    description: 'Reclaim ~20 GiB by deleting preinstalled toolchains. Set true for big-closure jobs (NixOS System); leave false for containers/devshells/packages — saves ~30s of overhead per job.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up dummy secrets
      shell: bash
      run: ./.github/scripts/setup-dummy-secrets.sh

    - name: Set Nix input overrides
      shell: bash
      run: |
        # nix-config CI uses github: refs for sibling sub-flakes (matches the
        # existing ci.yml pattern). Checks, container builds and PR host
        # builds evaluate against whatever's on the sibling's main branch —
        # same semantics as the per-sub-flake CIs, and the early warning for
        # cross-repo breakage. NOT used for the host toplevels built on main
        # and for promote's cache gate: devices resolve the committed lock
        # with zero overrides, so those steps do too (build-all.yaml,
        # "committed lock" step).
        echo "NIX_OVERRIDES=\
          --override-input kleinbem-secrets /tmp/dummy-secrets \
          --override-input nix-devshells github:kleinbem/nix-devshells \
          --override-input nix-hardware github:kleinbem/nix-hardware \
          --override-input nix-hardware/nix-devshells github:kleinbem/nix-devshells \
          --override-input nix-packages github:kleinbem/nix-packages \
          --override-input nix-packages/nix-devshells github:kleinbem/nix-devshells \
          --override-input nix-presets github:kleinbem/nix-presets \
          --override-input nix-presets/nix-devshells github:kleinbem/nix-devshells \
          --override-input nix-presets/nix-packages github:kleinbem/nix-packages \
          --override-input nix-presets/nix-packages/nix-devshells github:kleinbem/nix-devshells \
          --override-input nix-templates github:kleinbem/nix-templates \
          --override-input nix-templates/nix-devshells github:kleinbem/nix-devshells" >> "$GITHUB_ENV"

    - name: Nix setup
      uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
      with:
        netbird-setup-key: ${{ inputs.netbird-setup-key }}
        attic-token: ${{ inputs.attic-token }}
        configure-auto-gc: ${{ inputs.configure-auto-gc }}
        free-disk-space: ${{ inputs.free-disk-space }}
        extra-conf: |
          sandbox = false
        # nix-config's own copy stays authoritative for this repo; the
        # action ships the same root for repos that have none.
        ca-cert: pki/caddy-root.crt
